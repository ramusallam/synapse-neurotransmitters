<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Synapse</title>
<style>
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #141414;
    --ink-hi: #f5f5f5;
    --ink-mid: #a0a0a0;
    --ink-low: #6b7280;
    --na: #ff7a6b;
    --k: #5cc9ff;
    --protein: #b084ff;
    --atp: #ffd166;
    --amber: #d4a554;
    --ca: #4ade80;
    --nt: #f472b6;
    --transporter: #5eead4;
    --accent: #6366f1;
    --panel: #141414;
    --panel-border: rgba(255,255,255,0.10);
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    padding: 14px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
  }
  header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .step-indicator {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink-low);
    letter-spacing: 1px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 20px;
  }
  .handbook-banner {
    margin: 0 auto 14px;
    padding: 9px 18px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.08), rgba(244, 114, 182, 0.06));
    border: 1px solid rgba(255, 209, 102, 0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    line-height: 1.4;
    color: #cfc5aa;
  }
  .handbook-banner .hb-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 4px 8px;
    background: rgba(255, 209, 102, 0.18);
    color: #ffd166;
    border-radius: 5px;
  }
  .handbook-banner strong { color: #ffd166; font-weight: 600; }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  canvas { display: block; width: 100%; height: auto; }
  .phase-bar {
    padding: 16px 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    border-top: 1px solid var(--panel-border);
    background: rgba(5, 8, 20, 0.4);
  }
  .phase-name {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.1px;
    color: var(--accent);
    transition: color 400ms ease;
  }
  .sim-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 250ms ease;
  }
  .sim-controls.visible { opacity: 1; pointer-events: auto; }
  .sim-controls .sim-readout {
    font-size: 14px;
    color: var(--ink-mid);
    letter-spacing: 0.2px;
    min-width: 180px;
    text-align: right;
  }
  .sim-controls .sim-readout strong {
    color: var(--nt);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }
  .sim-controls button.sim-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(244, 114, 182, 0.35);
    background: rgba(244, 114, 182, 0.08);
    color: #f9a8d4;
    cursor: pointer;
    transition: background 150ms, border-color 150ms;
  }
  .sim-controls button.sim-btn:hover { background: rgba(244, 114, 182, 0.18); border-color: rgba(244, 114, 182, 0.6); }
  .sim-controls button.sim-btn.minus {
    border-color: rgba(94, 234, 212, 0.35);
    background: rgba(94, 234, 212, 0.08);
    color: #99f6e4;
  }
  .sim-controls button.sim-btn.minus:hover { background: rgba(94, 234, 212, 0.18); border-color: rgba(94, 234, 212, 0.6); }
  .content { margin-top: 14px; }
  .notes-card {
    background: var(--note-bg);
    color: var(--note-ink);
    padding: 16px 22px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    box-shadow:
      0 14px 40px rgba(255, 209, 102, 0.08),
      inset 0 0 0 1px rgba(0,0,0,0.02);
  }
  .step-heading {
    font-weight: 700;
    font-size: 16px;
    color: #7a3a00;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }
  .notes-card p { margin: 0 0 6px; }
  .notes-card strong { font-weight: 700; color: #2a1e08; }

  .notebook-prompt {
    margin-top: 10px;
    padding: 12px 16px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.15), rgba(244, 114, 182, 0.12));
    border: 1.5px solid rgba(255, 209, 102, 0.45);
    border-left: 5px solid #ffd166;
    border-radius: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: #f3d589;
  }
  .notebook-prompt .np-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 9px;
    background: #ffd166;
    color: #2a1e08;
    border-radius: 5px;
    margin-top: 1px;
  }
  .notebook-prompt strong { color: #ffd166; font-weight: 700; }

  nav {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: background 150ms, transform 50ms, border-color 150ms;
  }
  button:hover:not(:disabled) {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    color: #f5f5ff;
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.25);
  }
  button.primary:hover { filter: brightness(1.08); }
  .btn-group { display: flex; gap: 10px; }
  @media (max-width: 720px) {
    .phase-bar { grid-template-columns: 1fr; }
    .sim-controls { justify-content: space-between; }
    .phase-name { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">The Synapse</div>
  <div class="step-indicator" id="stepIndicator">01 / 10</div>
</header>

<main>
  <div class="handbook-banner">
    <div class="hb-tag">3a. LECTURE</div>
    <div>Follow along in the <strong>3a. Lecture</strong> section of your handbook. For each step: <strong>label it</strong>, <strong>copy the yellow box</strong>, and <strong>draw a simple diagram</strong>. Use <strong>color</strong>.</div>
  </div>
  <div class="stage">
    <canvas id="canvas" width="1600" height="650"></canvas>
    <div class="phase-bar">
      <div class="phase-name" id="phaseName">Step 1</div>
      <div class="sim-controls" id="simControls">
        <button class="sim-btn minus" id="ntMinusBtn">− Remove NTs</button>
        <button class="sim-btn" id="ntPlusBtn">+ Add NTs</button>
        <div class="sim-readout" id="simReadout">NTs in cleft: <strong>20</strong></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="notes-card">
      <div class="step-heading" id="stepHeading">Step 1</div>
      <p id="notes"></p>
    </div>
    <div class="notebook-prompt" id="notebookPrompt">
      <div class="np-tag">✎ NOTES</div>
      <div id="notebookText"></div>
    </div>
  </div>

  <nav>
    <button id="resetBtn">Start Over</button>
    <div class="btn-group">
      <button id="prevBtn">← Back</button>
      <button id="nextBtn" class="primary">Next →</button>
    </div>
  </nav>
</main>

<script>
// =====================================================
//  Canvas setup
// =====================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;   // 1600
const H = canvas.height;  // 650
const MID = H / 2;        // 325

// Synapse layout — flat parallel cleft
const PRE_MEM_X = 720;    // presynaptic membrane facing cleft (vertical line)
const POST_MEM_X = 880;   // postsynaptic membrane facing cleft
const CLEFT_MID = (PRE_MEM_X + POST_MEM_X) / 2;
const ACT_TOP = 215;      // active zone top
const ACT_BOT = 435;      // active zone bottom

// Colors
const C_NA = '#ff7a6b';
const C_K = '#5cc9ff';
const C_PROT = '#b084ff';
const C_ATP = '#ffd166';
const C_ACCENT = '#6366f1';
const C_CA = '#4ade80';
const C_CA_GLOW = 'rgba(74, 222, 128,';
const C_NT = '#f472b6';
const C_NT_GLOW = 'rgba(244, 114, 182,';
const C_TRANS = '#5eead4';
const C_TRANS_GLOW = 'rgba(94, 234, 212,';
const C_SSRI = '#7dd3fc';

// =====================================================
//  Helpers
// =====================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function seededRng(seed) {
  let s = seed;
  return function() { s = (s * 16807) % 2147483647; return s / 2147483647; };
}

function buildDendriteTree(x0, y0, angle, length, depth, rng, segments = []) {
  if (depth === 0 || length < 18) return segments;
  const endX = x0 + Math.cos(angle) * length;
  const endY = y0 + Math.sin(angle) * length;
  const cpX = x0 + Math.cos(angle) * length * 0.5 + (rng() - 0.5) * 30;
  const cpY = y0 + Math.sin(angle) * length * 0.5 + (rng() - 0.5) * 30;
  segments.push({ x1: x0, y1: y0, cx: cpX, cy: cpY, x2: endX, y2: endY, w: depth * 2 });
  const branchAngle = 0.45 + rng() * 0.3;
  const lenScale = 0.6 + rng() * 0.15;
  buildDendriteTree(endX, endY, angle - branchAngle, length * lenScale, depth - 1, rng, segments);
  buildDendriteTree(endX, endY, angle + branchAngle, length * lenScale, depth - 1, rng, segments);
  if (rng() > 0.6) {
    buildDendriteTree(endX, endY, angle + (rng() - 0.5) * 0.3, length * 0.5, depth - 1, rng, segments);
  }
  return segments;
}

// =====================================================
//  Full neuron renderer (matches Action Potential app)
// =====================================================
function drawFullNeuron(ctx, opts = {}) {
  const rng = seededRng(7);
  const soma = { x: 340, y: MID };
  const trees = [
    buildDendriteTree(soma.x - 70, soma.y - 85, -Math.PI * 0.72, 130, 4, rng),
    buildDendriteTree(soma.x - 95, soma.y - 35, -Math.PI * 0.92, 120, 4, rng),
    buildDendriteTree(soma.x - 98, soma.y + 25, Math.PI * 0.94, 120, 4, rng),
    buildDendriteTree(soma.x - 70, soma.y + 85, Math.PI * 0.72, 130, 4, rng),
    buildDendriteTree(soma.x - 30, soma.y - 100, -Math.PI * 0.55, 110, 3, rng),
    buildDendriteTree(soma.x - 30, soma.y + 100, Math.PI * 0.55, 110, 3, rng)
  ];
  ctx.lineCap = 'round';
  trees.forEach(tree => {
    tree.forEach(seg => {
      ctx.strokeStyle = `rgba(209, 154, 143, ${0.55 + seg.w * 0.05})`;
      ctx.lineWidth = seg.w;
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.quadraticCurveTo(seg.cx, seg.cy, seg.x2, seg.y2);
      ctx.stroke();
    });
  });
  const glow = ctx.createRadialGradient(soma.x, soma.y, 0, soma.x, soma.y, 180);
  glow.addColorStop(0, 'rgba(245, 208, 197, 0.16)');
  glow.addColorStop(1, 'rgba(245, 208, 197, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(soma.x, soma.y, 180, 0, Math.PI * 2); ctx.fill();
  const somaFill = ctx.createRadialGradient(soma.x - 25, soma.y - 25, 10, soma.x, soma.y, 120);
  somaFill.addColorStop(0, '#f8d9ce');
  somaFill.addColorStop(0.7, '#d49a8d');
  somaFill.addColorStop(1, '#a86456');
  ctx.fillStyle = somaFill;
  ctx.beginPath();
  ctx.moveTo(soma.x - 95, soma.y + 5);
  ctx.bezierCurveTo(soma.x - 100, soma.y - 70, soma.x - 30, soma.y - 105, soma.x + 25, soma.y - 95);
  ctx.bezierCurveTo(soma.x + 85, soma.y - 85, soma.x + 110, soma.y - 30, soma.x + 105, soma.y + 5);
  ctx.bezierCurveTo(soma.x + 110, soma.y + 50, soma.x + 60, soma.y + 95, soma.x + 5, soma.y + 100);
  ctx.bezierCurveTo(soma.x - 55, soma.y + 105, soma.x - 95, soma.y + 65, soma.x - 95, soma.y + 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.7)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#8f4c3e';
  ctx.beginPath(); ctx.arc(soma.x - 8, soma.y - 8, 36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a2a1e';
  ctx.beginPath(); ctx.arc(soma.x + 2, soma.y - 2, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d49a8d';
  ctx.beginPath();
  ctx.moveTo(soma.x + 95, soma.y - 28);
  ctx.lineTo(soma.x + 95, soma.y + 28);
  ctx.lineTo(soma.x + 170, soma.y + 14);
  ctx.lineTo(soma.x + 170, soma.y - 14);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.6)';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = '#d49a8d';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(soma.x + 170, soma.y);
  ctx.bezierCurveTo(soma.x + 430, soma.y - 14, soma.x + 760, soma.y + 14, W - 260, soma.y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 220, 208, 0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(soma.x + 170, soma.y - 9);
  ctx.bezierCurveTo(soma.x + 430, soma.y - 23, soma.x + 760, soma.y + 5, W - 260, soma.y - 9);
  ctx.stroke();
  const termX = W - 260;
  const termAngles = [-0.55, -0.28, -0.05, 0.22, 0.5, -0.42, 0.38];
  termAngles.forEach((a, i) => {
    const len = 120 + (i % 3) * 20;
    ctx.strokeStyle = '#d49a8d';
    ctx.lineWidth = 10 + (i % 2) * 3;
    ctx.beginPath();
    ctx.moveTo(termX, soma.y);
    const mx = termX + Math.cos(a) * len * 0.55;
    const my = soma.y + Math.sin(a) * len * 0.55 + (i % 2 === 0 ? 8 : -8);
    const ex = termX + Math.cos(a) * len;
    const ey = soma.y + Math.sin(a) * len;
    ctx.quadraticCurveTo(mx, my, ex, ey);
    ctx.stroke();
    const bg = ctx.createRadialGradient(ex - 3, ey - 3, 2, ex, ey, 18);
    bg.addColorStop(0, '#fae2d4'); bg.addColorStop(1, '#c78373');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(ex, ey, 14 + (i % 3) * 2, 0, Math.PI * 2); ctx.fill();
  });
  return { soma, termX };
}

// =====================================================
//  Lightning bolt along the axon
// =====================================================
function drawLightningBolt(ctx, startX, endX, baseY, progress, sparkles) {
  const segs = 22;
  const points = [];
  for (let i = 0; i <= segs; i++) {
    const f = i / segs;
    const x = lerp(startX, endX, f);
    const baseOffsetY = Math.sin(f * Math.PI * 2.2) * 6;
    const jag = (Math.random() - 0.5) * 14;
    points.push({ x, y: baseY + baseOffsetY + jag * (f < progress ? 1 : 0) });
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 209, 102, 0.5)';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowBlur = 28;
  ctx.shadowColor = 'rgba(255, 209, 102, 0.9)';
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const f = i / segs; if (f > progress) break;
    const p = points[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.shadowBlur = 14;
  ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const f = i / segs; if (f > progress) break;
    const p = points[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.restore();
  // sparkles
  if (sparkles) {
    sparkles.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.life * 0.8;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 18);
      g.addColorStop(0, 'rgba(255,255,220,0.9)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }
}

// =====================================================
//  Synapse: bouton + dendrite drawing
// =====================================================
function drawPresynapticTerminal(ctx, opts = {}) {
  const cx = 380, cy = MID;
  ctx.save();
  // axon trail entering from left
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, MID - 18);
  ctx.bezierCurveTo(80, MID - 18, 130, MID - 12, 180, MID - 6);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 220, 208, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, MID - 26);
  ctx.bezierCurveTo(80, MID - 26, 130, MID - 22, 180, MID - 16);
  ctx.stroke();

  // glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 460);
  glow.addColorStop(0, 'rgba(245, 208, 197, 0.10)');
  glow.addColorStop(1, 'rgba(245, 208, 197, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, 460, 0, Math.PI * 2); ctx.fill();

  // bouton blob — organic shape with flat right active zone
  const fill = ctx.createRadialGradient(cx - 60, cy - 80, 30, cx, cy, 360);
  fill.addColorStop(0, '#f8d9ce');
  fill.addColorStop(0.5, '#d49a8d');
  fill.addColorStop(1, '#a86456');
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(170, MID - 18);
  ctx.bezierCurveTo(110, MID - 70, 90, MID - 170, 200, MID - 220);
  ctx.bezierCurveTo(310, MID - 250, 470, MID - 250, 580, MID - 215);
  ctx.bezierCurveTo(660, MID - 185, 700, MID - 155, 720, MID - 110);
  // active zone: straight vertical face
  ctx.lineTo(720, MID + 110);
  ctx.bezierCurveTo(700, MID + 155, 660, MID + 185, 580, MID + 215);
  ctx.bezierCurveTo(470, MID + 250, 310, MID + 250, 200, MID + 220);
  ctx.bezierCurveTo(90, MID + 170, 110, MID + 70, 170, MID + 18);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // membrane highlight on active zone (right edge)
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(720, MID - 110);
  ctx.lineTo(720, MID + 110);
  ctx.stroke();

  ctx.restore();
}

function drawPostsynapticDendrite(ctx, opts = {}) {
  const cx = 1180, cy = MID;
  ctx.save();
  // dendrite branch trailing off to right
  ctx.strokeStyle = '#9a7fc0';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(W - 200, MID);
  ctx.lineTo(W, MID);
  ctx.stroke();

  // glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 460);
  glow.addColorStop(0, 'rgba(176, 132, 255, 0.10)');
  glow.addColorStop(1, 'rgba(176, 132, 255, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, 460, 0, Math.PI * 2); ctx.fill();

  // dendrite blob — mirrored organic shape
  const fill = ctx.createRadialGradient(cx + 60, cy - 80, 30, cx, cy, 360);
  fill.addColorStop(0, '#d4c0ee');
  fill.addColorStop(0.5, '#9a7fc0');
  fill.addColorStop(1, '#705396');
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(W - 170, MID - 18);
  ctx.bezierCurveTo(W - 110, MID - 70, W - 90, MID - 170, 1400, MID - 220);
  ctx.bezierCurveTo(1290, MID - 250, 1130, MID - 250, 1020, MID - 215);
  ctx.bezierCurveTo(940, MID - 185, 900, MID - 155, 880, MID - 110);
  ctx.lineTo(880, MID + 110);
  ctx.bezierCurveTo(900, MID + 155, 940, MID + 185, 1020, MID + 215);
  ctx.bezierCurveTo(1130, MID + 250, 1290, MID + 250, 1400, MID + 220);
  ctx.bezierCurveTo(W - 90, MID + 170, W - 110, MID + 70, W - 170, MID + 18);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 60, 110, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // membrane highlight on active zone (left edge)
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(880, MID - 110);
  ctx.lineTo(880, MID + 110);
  ctx.stroke();

  ctx.restore();
}

// =====================================================
//  Synapse parts: Ca channel, Receptor (ball-socket), Transporter (vacuum)
// =====================================================
function drawCalciumChannel(ctx, y, openness) {
  const x = PRE_MEM_X;
  const halfH = 26;
  ctx.save();
  // base embedded in membrane, mostly inside bouton
  const base = ctx.createLinearGradient(x - 18, 0, x + 18, 0);
  base.addColorStop(0, 'rgba(20, 35, 25, 0.95)');
  base.addColorStop(0.5, 'rgba(15, 25, 20, 0.98)');
  base.addColorStop(1, 'rgba(20, 35, 25, 0.95)');
  ctx.fillStyle = base;
  roundRect(ctx, x - 22, y - halfH, 44, halfH * 2, 8);
  ctx.fill();
  ctx.strokeStyle = openness > 0.3 ? C_CA : 'rgba(120, 200, 150, 0.45)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // gates open as channel activates
  const gap = openness * 14;
  ctx.fillStyle = openness > 0.3 ? `rgba(74, 222, 128, ${0.55 + openness * 0.4})` : 'rgba(74, 222, 128, 0.28)';
  ctx.beginPath(); ctx.ellipse(x - 12 + gap, y - halfH + 9, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 12 - gap, y + halfH - 9, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  // label
  ctx.fillStyle = 'rgba(74, 222, 128, 0.95)';
  ctx.font = '700 11px -apple-system, system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Ca²⁺', x, y);
  ctx.restore();
}

// Receptor — Y-cup with circular socket facing cleft. NT ball drops into the socket.
function drawReceptor(ctx, y, boundFraction) {
  const x = POST_MEM_X;
  ctx.save();
  // trunk embedded in dendrite (right of membrane)
  ctx.fillStyle = 'rgba(70, 50, 110, 0.95)';
  roundRect(ctx, x, y - 18, 22, 36, 6);
  ctx.fill();
  // cup arms extending into cleft (left of membrane)
  const cupColor = boundFraction > 0.5 ? '#c4a3ff' : '#9a7fc0';
  ctx.fillStyle = cupColor;
  // top arm
  ctx.beginPath();
  ctx.moveTo(x + 2, y - 22);
  ctx.lineTo(x - 22, y - 16);
  ctx.lineTo(x - 22, y - 6);
  ctx.lineTo(x + 2, y - 4);
  ctx.closePath();
  ctx.fill();
  // bottom arm
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 22);
  ctx.lineTo(x - 22, y + 16);
  ctx.lineTo(x - 22, y + 6);
  ctx.lineTo(x + 2, y + 4);
  ctx.closePath();
  ctx.fill();
  // socket
  if (boundFraction < 0.5) {
    // empty
    ctx.fillStyle = 'rgba(40, 25, 70, 0.95)';
    ctx.beginPath(); ctx.arc(x - 10, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(176, 132, 255, 0.65)';
    ctx.lineWidth = 1.5; ctx.stroke();
  } else {
    // bound — NT ball sits in socket
    const f = boundFraction;
    const gg = ctx.createRadialGradient(x - 10, y, 0, x - 10, y, 26);
    gg.addColorStop(0, `rgba(244, 114, 182, ${f * 0.5})`);
    gg.addColorStop(1, 'rgba(244, 114, 182, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x - 10, y, 26, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createRadialGradient(x - 12, y - 2, 0, x - 10, y, 8);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.4, C_NT);
    cg.addColorStop(1, '#be3879');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(x - 10, y, 8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Reuptake transporter — a vacuum / pump shape with mouth facing cleft
function drawTransporter(ctx, y, active, t) {
  const x = PRE_MEM_X;
  ctx.save();
  // trunk inside bouton
  ctx.fillStyle = 'rgba(20, 50, 50, 0.95)';
  roundRect(ctx, x - 22, y - 18, 22, 36, 6);
  ctx.fill();
  // outer mouth
  const armColor = active > 0.4 ? C_TRANS : 'rgba(94, 234, 212, 0.5)';
  ctx.fillStyle = armColor;
  // top arm (cup)
  ctx.beginPath();
  ctx.moveTo(x - 2, y - 22);
  ctx.lineTo(x + 22, y - 16);
  ctx.lineTo(x + 22, y - 6);
  ctx.lineTo(x - 2, y - 4);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 2, y + 22);
  ctx.lineTo(x + 22, y + 16);
  ctx.lineTo(x + 22, y + 6);
  ctx.lineTo(x - 2, y + 4);
  ctx.closePath();
  ctx.fill();
  // dark interior pore
  ctx.fillStyle = 'rgba(10, 28, 28, 0.95)';
  ctx.beginPath();
  ctx.moveTo(x - 2, y - 4);
  ctx.lineTo(x + 22, y - 4);
  ctx.lineTo(x + 22, y + 4);
  ctx.lineTo(x - 2, y + 4);
  ctx.closePath();
  ctx.fill();
  // pulsing pull glow when active
  if (active > 0.3) {
    const pulse = (Math.sin((t || 0) / 250 + y * 0.05) + 1) * 0.5;
    const r = 26 + pulse * 8;
    const gg = ctx.createRadialGradient(x + 14, y, 0, x + 14, y, r);
    gg.addColorStop(0, `rgba(94, 234, 212, ${0.45 * (1 - pulse * 0.4)})`);
    gg.addColorStop(1, 'rgba(94, 234, 212, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x + 14, y, r, 0, Math.PI * 2); ctx.fill();
    // pulling arrow inside the pore
    ctx.fillStyle = `rgba(94, 234, 212, ${0.6 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.moveTo(x + 16, y - 6);
    ctx.lineTo(x - 4, y);
    ctx.lineTo(x + 16, y + 6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Vesicle — sphere full of NT dots
function drawVesicle(ctx, x, y, r, fuseFraction) {
  if (fuseFraction >= 1) return;
  ctx.save();
  ctx.globalAlpha = 1 - fuseFraction;
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
  g.addColorStop(0, 'rgba(255, 245, 220, 0.95)');
  g.addColorStop(0.7, 'rgba(255, 220, 170, 0.7)');
  g.addColorStop(1, 'rgba(212, 165, 84, 0.5)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * (1 + fuseFraction * 0.3), 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 209, 102, 0.85)';
  ctx.lineWidth = 1.5; ctx.stroke();
  // NTs inside
  ctx.fillStyle = C_NT;
  for (let i = 0; i < 5; i++) {
    const a = i * 1.25;
    const rr = r * 0.5;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// =====================================================
//  Particles
// =====================================================
class NT {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.r = 7;
    this.state = 'free'; // free, transitTo, bound, recycled
    this.bondT = 0;
    this.target = null;
    this.pathT = 0; this.pathSpeed = 0;
    this.pathStart = null; this.pathEnd = null;
    this.boundReceptor = null;
    this.trail = [];
  }
  update(dt) {
    this.trail.unshift({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.pop();
    if (this.state === 'transitTo') {
      this.pathT += this.pathSpeed * dt;
      if (this.pathT >= 1) {
        this.pathT = 1;
        this.x = this.pathEnd.x; this.y = this.pathEnd.y;
        if (this.target === 'receptor' && this.boundReceptor) {
          this.state = 'bound'; this.bondT = 0;
        } else if (this.target === 'reuptake') {
          this.state = 'recycled';
        } else {
          this.state = 'free';
          this.vx = (Math.random() - 0.5) * 1.0;
          this.vy = (Math.random() - 0.5) * 1.0;
        }
        return;
      }
      const tt = this.pathT;
      const ease = tt * tt * (3 - 2 * tt);
      this.x = lerp(this.pathStart.x, this.pathEnd.x, ease);
      this.y = lerp(this.pathStart.y, this.pathEnd.y, ease);
      return;
    }
    if (this.state === 'bound') { this.bondT += dt; return; }
    if (this.state === 'recycled') return;
    // free drift
    this.vx += (Math.random() - 0.5) * 0.18;
    this.vy += (Math.random() - 0.5) * 0.18;
    this.vx *= 0.95;
    this.vy *= 0.95;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 1.0) { this.vx = this.vx / sp * 1.0; this.vy = this.vy / sp * 1.0; }
    this.x += this.vx; this.y += this.vy;
    if (this.y < ACT_TOP + 12) { this.y = ACT_TOP + 12; this.vy = Math.abs(this.vy); }
    if (this.y > ACT_BOT - 12) { this.y = ACT_BOT - 12; this.vy = -Math.abs(this.vy); }
    if (this.x < PRE_MEM_X + this.r + 4) { this.x = PRE_MEM_X + this.r + 4; this.vx = Math.abs(this.vx); }
    if (this.x > POST_MEM_X - this.r - 4) { this.x = POST_MEM_X - this.r - 4; this.vx = -Math.abs(this.vx); }
  }
  setTransit(end, speed, target, receptor) {
    this.state = 'transitTo';
    this.pathStart = { x: this.x, y: this.y };
    this.pathEnd = end;
    this.pathT = 0; this.pathSpeed = speed;
    this.target = target;
    this.boundReceptor = receptor || null;
  }
  draw(ctx) {
    if (this.state === 'recycled') return;
    if (this.state === 'bound') return; // receptor draws the bound ball
    ctx.save();
    for (let i = this.trail.length - 1; i > 0; i--) {
      const p = this.trail[i];
      const a = (1 - i / this.trail.length) * 0.18;
      ctx.fillStyle = C_NT_GLOW + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, this.r * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 2.4);
    g.addColorStop(0, C_NT_GLOW + '0.55)');
    g.addColorStop(0.5, C_NT_GLOW + '0.2)');
    g.addColorStop(1, C_NT_GLOW + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.4, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createRadialGradient(this.x - this.r * 0.3, this.y - this.r * 0.3, 0, this.x, this.y, this.r);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.3, C_NT);
    cg.addColorStop(1, '#be3879');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}

class Calcium {
  constructor(x, y, region) {
    this.x = x; this.y = y;
    this.region = region;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.r = 8;
    this.state = 'free';
    this.pathT = 0; this.pathSpeed = 0;
    this.pathStart = null; this.pathEnd = null;
    this.trail = [];
  }
  update(dt) {
    this.trail.unshift({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.pop();
    if (this.state === 'transit') {
      this.pathT += this.pathSpeed * dt;
      if (this.pathT >= 1) {
        this.pathT = 1; this.x = this.pathEnd.x; this.y = this.pathEnd.y;
        this.state = 'free'; this.region = 'inside';
        this.vx = (Math.random() - 0.5) * 1.4;
        this.vy = (Math.random() - 0.5) * 1.4;
        return;
      }
      const tt = this.pathT;
      const ease = tt * tt * (3 - 2 * tt);
      this.x = lerp(this.pathStart.x, this.pathEnd.x, ease);
      this.y = lerp(this.pathStart.y, this.pathEnd.y, ease);
      return;
    }
    this.vx += (Math.random() - 0.5) * 0.2;
    this.vy += (Math.random() - 0.5) * 0.2;
    this.vx *= 0.94; this.vy *= 0.94;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 1.4) { this.vx = this.vx / sp * 1.4; this.vy = this.vy / sp * 1.4; }
    this.x += this.vx; this.y += this.vy;
    if (this.region === 'outside') {
      if (this.y < ACT_TOP + 12) { this.y = ACT_TOP + 12; this.vy = Math.abs(this.vy); }
      if (this.y > ACT_BOT - 12) { this.y = ACT_BOT - 12; this.vy = -Math.abs(this.vy); }
      if (this.x < PRE_MEM_X + this.r + 4) { this.x = PRE_MEM_X + this.r + 4; this.vx = Math.abs(this.vx); }
      if (this.x > POST_MEM_X - this.r - 4) { this.x = POST_MEM_X - this.r - 4; this.vx = -Math.abs(this.vx); }
    } else {
      if (this.y < ACT_TOP + 12) { this.y = ACT_TOP + 12; this.vy = Math.abs(this.vy); }
      if (this.y > ACT_BOT - 12) { this.y = ACT_BOT - 12; this.vy = -Math.abs(this.vy); }
      if (this.x < 220) { this.x = 220; this.vx = Math.abs(this.vx); }
      if (this.x > PRE_MEM_X - this.r - 8) { this.x = PRE_MEM_X - this.r - 8; this.vx = -Math.abs(this.vx); }
    }
  }
  setTransit(end, speed) {
    this.state = 'transit';
    this.pathStart = { x: this.x, y: this.y };
    this.pathEnd = end;
    this.pathT = 0; this.pathSpeed = speed;
  }
  draw(ctx) {
    ctx.save();
    for (let i = this.trail.length - 1; i > 0; i--) {
      const p = this.trail[i];
      const a = (1 - i / this.trail.length) * 0.18;
      ctx.fillStyle = C_CA_GLOW + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, this.r * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 2.5);
    g.addColorStop(0, C_CA_GLOW + '0.55)');
    g.addColorStop(0.5, C_CA_GLOW + '0.2)');
    g.addColorStop(1, C_CA_GLOW + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createRadialGradient(this.x - this.r * 0.3, this.y - this.r * 0.3, 0, this.x, this.y, this.r);
    cg.addColorStop(0, 'rgba(255,255,255,0.9)');
    cg.addColorStop(0.3, C_CA);
    cg.addColorStop(1, '#22a55a');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '700 9px -apple-system, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Ca²⁺', this.x, this.y + 0.5);
    ctx.restore();
  }
}

class Vesicle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 18;
    this.state = 'rest';
    this.dockTarget = null;
    this.dockT = 0;
    this.fuseT = 0;
  }
  update(dt) {
    if (this.state === 'docking') {
      this.dockT += dt / 800;
      if (this.dockT >= 1) {
        this.dockT = 1;
        this.x = this.dockTarget.x; this.y = this.dockTarget.y;
        this.state = 'fused';
      } else {
        const t = this.dockT * this.dockT * (3 - 2 * this.dockT);
        this.x = lerp(this.x0, this.dockTarget.x, t);
        this.y = lerp(this.y0, this.dockTarget.y, t);
      }
    } else if (this.state === 'fused') {
      this.fuseT += dt / 600;
      if (this.fuseT > 1) this.fuseT = 1;
    } else {
      this.x += (Math.random() - 0.5) * 0.3;
      this.y += (Math.random() - 0.5) * 0.3;
    }
  }
  startDock(target) {
    this.state = 'docking'; this.dockT = 0;
    this.x0 = this.x; this.y0 = this.y;
    this.dockTarget = target;
  }
  draw(ctx) {
    if (this.state === 'fused' && this.fuseT >= 1) return;
    const fade = this.state === 'fused' ? this.fuseT : 0;
    drawVesicle(ctx, this.x, this.y, this.r, fade);
  }
}

// SSRI molecule (drug)
class SSRI {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 10;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.state = 'free'; // free, transitTo, locked
    this.pathT = 0; this.pathSpeed = 0;
    this.pathStart = null; this.pathEnd = null;
    this.targetTr = null;
  }
  update(dt) {
    if (this.state === 'transitTo') {
      this.pathT += this.pathSpeed * dt;
      if (this.pathT >= 1) {
        this.pathT = 1;
        this.x = this.pathEnd.x; this.y = this.pathEnd.y;
        this.state = 'locked';
        if (this.targetTr) this.targetTr.blocked = true;
        return;
      }
      const tt = this.pathT;
      const ease = tt * tt * (3 - 2 * tt);
      this.x = lerp(this.pathStart.x, this.pathEnd.x, ease);
      this.y = lerp(this.pathStart.y, this.pathEnd.y, ease);
      return;
    }
    if (this.state === 'locked') return;
    this.vx += (Math.random() - 0.5) * 0.1;
    this.vy += (Math.random() - 0.5) * 0.1;
    this.vx *= 0.96; this.vy *= 0.96;
    this.x += this.vx; this.y += this.vy;
    if (this.y < 50) { this.y = 50; this.vy = Math.abs(this.vy); }
    if (this.y > H - 50) { this.y = H - 50; this.vy = -Math.abs(this.vy); }
  }
  setTransit(end, speed, tr) {
    this.state = 'transitTo';
    this.pathStart = { x: this.x, y: this.y };
    this.pathEnd = end;
    this.pathT = 0; this.pathSpeed = speed;
    this.targetTr = tr;
  }
  draw(ctx) {
    ctx.save();
    // capsule shape
    const x = this.x, y = this.y, r = this.r;
    const g = ctx.createLinearGradient(x - r, y, x + r, y);
    g.addColorStop(0, '#bae6fd');
    g.addColorStop(0.5, C_SSRI);
    g.addColorStop(1, '#0284c7');
    ctx.fillStyle = g;
    roundRect(ctx, x - r * 1.6, y - r * 0.7, r * 3.2, r * 1.4, r * 0.7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1; ctx.stroke();
    // glow
    const gg = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
    gg.addColorStop(0, 'rgba(125, 211, 252, 0.5)');
    gg.addColorStop(1, 'rgba(125, 211, 252, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, r * 2.5, 0, Math.PI * 2); ctx.fill();
    // label
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '700 8px -apple-system, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('SSRI', x, y + 0.5);
    ctx.restore();
  }
}

// =====================================================
//  Label helper
// =====================================================
function drawLabel(ctx, text, lx, ly, tx, ty, color = '#ffd166', fontSize = 16) {
  ctx.save();
  ctx.font = `700 ${fontSize}px -apple-system, system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(tx, ty, 4, 0, Math.PI * 2); ctx.fill();
  const m = ctx.measureText(text);
  const padX = 10;
  const bw = m.width + padX * 2;
  const bh = fontSize + 12;
  ctx.fillStyle = 'rgba(16, 24, 48, 0.9)';
  ctx.strokeStyle = `${color}aa`;

// =====================================================
//  SCENE 9: Neuroplasticity — synapses strengthen with use
// =====================================================
function drawMiniSynapse(ctx, ox, oy, scale, opts) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.translate(-W / 2, -H / 2);

  // simplified bouton + dendrite
  const cx1 = 380, cy = MID;
  // bouton
  const fill1 = ctx.createRadialGradient(cx1 - 60, cy - 80, 30, cx1, cy, 360);
  fill1.addColorStop(0, '#f8d9ce');
  fill1.addColorStop(0.5, '#d49a8d');
  fill1.addColorStop(1, '#a86456');
  ctx.fillStyle = fill1;
  ctx.beginPath();
  ctx.moveTo(170, MID - 18);
  ctx.bezierCurveTo(110, MID - 70, 90, MID - 170, 200, MID - 220);
  ctx.bezierCurveTo(310, MID - 250, 470, MID - 250, 580, MID - 215);
  ctx.bezierCurveTo(660, MID - 185, 700, MID - 155, 720, MID - 110);
  ctx.lineTo(720, MID + 110);
  ctx.bezierCurveTo(700, MID + 155, 660, MID + 185, 580, MID + 215);
  ctx.bezierCurveTo(470, MID + 250, 310, MID + 250, 200, MID + 220);
  ctx.bezierCurveTo(90, MID + 170, 110, MID + 70, 170, MID + 18);
  ctx.closePath(); ctx.fill();

  const fill2 = ctx.createRadialGradient(1180 + 60, MID - 80, 30, 1180, MID, 360);
  fill2.addColorStop(0, '#d4c0ee');
  fill2.addColorStop(0.5, '#9a7fc0');
  fill2.addColorStop(1, '#705396');
  ctx.fillStyle = fill2;
  ctx.beginPath();
  ctx.moveTo(W - 170, MID - 18);
  ctx.bezierCurveTo(W - 110, MID - 70, W - 90, MID - 170, 1400, MID - 220);
  ctx.bezierCurveTo(1290, MID - 250, 1130, MID - 250, 1020, MID - 215);
  ctx.bezierCurveTo(940, MID - 185, 900, MID - 155, 880, MID - 110);
  ctx.lineTo(880, MID + 110);
  ctx.bezierCurveTo(900, MID + 155, 940, MID + 185, 1020, MID + 215);
  ctx.bezierCurveTo(1130, MID + 250, 1290, MID + 250, 1400, MID + 220);
  ctx.bezierCurveTo(W - 90, MID + 170, W - 110, MID + 70, W - 170, MID + 18);
  ctx.closePath(); ctx.fill();

  // active zone membranes
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(720, MID - 110); ctx.lineTo(720, MID + 110);
  ctx.moveTo(880, MID - 110); ctx.lineTo(880, MID + 110);
  ctx.stroke();

  // vesicles + receptors based on strength
  const ves = opts.vesicles || 4;
  const recs = opts.receptors || 2;
  for (let i = 0; i < ves; i++) {
    const a = i * 1.7;
    const r = 60 + (i % 3) * 30;
    const vx = 380 + Math.cos(a) * r;
    const vy = MID + Math.sin(a) * r * 0.6;
    drawVesicle(ctx, vx, vy, 22, 0);
  }
  // receptors evenly spaced
  for (let i = 0; i < recs; i++) {
    const ry = ACT_TOP + 30 + (i + 0.5) * (ACT_BOT - ACT_TOP - 60) / recs;
    drawReceptor(ctx, ry, opts.fired ? 1 : 0);
  }

  ctx.restore();
}

      if (tr.blocked) {
        ctx.save();
        // red X over the transporter mouth
        const x = PRE_MEM_X + 12;
        ctx.strokeStyle = 'rgba(255, 80, 80, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x - 12, tr.y - 12); ctx.lineTo(x + 12, tr.y + 12);
        ctx.moveTo(x + 12, tr.y - 12); ctx.lineTo(x - 12, tr.y + 12);
        ctx.stroke();
        // BLOCKED label
        ctx.fillStyle = '#ff5050';
        ctx.font = '700 11px -apple-system, system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('BLOCKED', x, tr.y - 30);
        ctx.restore();
      }
    });

    // Na ions
    sceneLocal.naIons.forEach(n => {
      ctx.save();
      ctx.globalAlpha = n.life;
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 16);
      g.addColorStop(0, 'rgba(255, 122, 107, 0.5)');
      g.addColorStop(1, 'rgba(255, 122, 107, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C_NA;
      ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '700 9px -apple-system, system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Na⁺', n.x, n.y);
      ctx.restore();
    });

    // AP bolts on post side
    sceneLocal.apTrains.forEach(ap => {
      drawLightningBolt(ctx, POST_MEM_X + 60, W - 30, MID, ap.progress, []);
    });
    sceneLocal.sparkles.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.life * 0.7;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 16);
      g.addColorStop(0, 'rgba(255,255,220,0.9)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // Header
    ctx.save();
    ctx.fillStyle = C_SSRI;
    ctx.font = '900 26px -apple-system, system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('ZOLOFT (SSRI)', CLEFT_MID, 50);
    ctx.font = '500 13px -apple-system, system-ui';
    ctx.fillStyle = 'rgba(125, 211, 252, 0.85)';
    ctx.fillText('Selective Serotonin Reuptake Inhibitor', CLEFT_MID, 72);
    ctx.restore();

    // Footer note
    if (sceneLocal.blockingStarted) {
      ctx.save();
      ctx.fillStyle = 'rgba(125, 211, 252, 0.95)';
      ctx.font = '700 16px -apple-system, system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('reuptake blocked → serotonin stays in synapse longer → mood signal lasts longer', CLEFT_MID, H - 30);
      ctx.restore();
    }
  }
};

// =====================================================
//  Scenes list
// =====================================================
const scenes = [
  sceneNeuron,         // 1
  sceneSynapse,        // 2
  sceneCalcium,        // 3
  sceneRelease,        // 4
  sceneBindFire,       // 5
  sceneReuptake,       // 6
  sceneZoomOut,        // 7
  sceneInteractive,    // 8
  sceneNeuroplasticity,// 9
  sceneSSRI            // 10
];

// =====================================================
//  UI
// =====================================================
const phaseNameEl = document.getElementById("phaseName");
const notesEl = document.getElementById("notes");
const stepHeadingEl = document.getElementById("stepHeading");
const notebookTextEl = document.getElementById("notebookText");
const stepIndicator = document.getElementById("stepIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");
const simControlsEl = document.getElementById("simControls");
const ntPlusBtn = document.getElementById("ntPlusBtn");
const ntMinusBtn = document.getElementById("ntMinusBtn");
const simReadout = document.getElementById("simReadout");

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function setScene(i) {
  currentSceneIdx = i;
  animT = 0;
  sceneFadeT = 0;
  const s = scenes[i];
  if (s.setup) s.setup();
  phaseNameEl.textContent = s.phase;
  phaseNameEl.style.color = s.phaseColor;
  notesEl.innerHTML = s.notes;
  stepHeadingEl.textContent = s.phase;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === scenes.length - 1;
  nextBtn.textContent = i === scenes.length - 1 ? 'Done' : 'Next →';
  if (s.isInteractive) simControlsEl.classList.add('visible');
  else simControlsEl.classList.remove('visible');
}

prevBtn.addEventListener("click", () => { if (currentSceneIdx > 0) setScene(currentSceneIdx - 1); });
nextBtn.addEventListener("click", () => { if (currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1); });
resetBtn.addEventListener("click", () => setScene(0));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" && currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1);
  if (e.key === "ArrowLeft" && currentSceneIdx > 0) setScene(currentSceneIdx - 1);
});
ntPlusBtn.addEventListener("click", () => {
  const s = scenes[currentSceneIdx];
  if (s.isInteractive && s.addNTs) { s.addNTs(8); updateSimReadout(); }
});
ntMinusBtn.addEventListener("click", () => {
  const s = scenes[currentSceneIdx];
  if (s.isInteractive && s.removeNTs) { s.removeNTs(8); updateSimReadout(); }
});
function updateSimReadout() {
  if (sceneLocal && sceneLocal.nts) simReadout.innerHTML = `NTs in cleft: <strong>${sceneLocal.nts.length}</strong>`;
}

// =====================================================
//  Main loop
// =====================================================
let lastTs = null;
function tick(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  animT += dt;
  sceneFadeT = Math.min(1, sceneFadeT + dt / 600);
  const s = scenes[currentSceneIdx];
  if (s.update) s.update(dt);
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = sceneFadeT;
  s.draw(ctx, animT);
  ctx.restore();
  if (s.isInteractive) updateSimReadout();
  requestAnimationFrame(tick);
}

setScene(0);
requestAnimationFrame(tick);
</script>
</body>
