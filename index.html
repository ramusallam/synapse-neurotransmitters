// ── Panel 1: BUILD — bouton grows out and connects to next neuron ──
function panelBuild(ctx, px, py, pw, ph, time) {
  const cy = py + ph / 2 + 18;
  const ax = px + 130;
  const bx = px + pw - 130;
  const t = (time % 4500) / 4500;

  drawTinyNeuron(ctx, ax, cy, '#d49a8d', 1);   // left, axon points right
  drawTinyNeuron(ctx, bx, cy, '#9a7fc0', -1);  // right, dendrites point left

  // growing axon from left toward right
  const startX = ax + 13;
  const dendriteTipX = bx - 12;
  const grow = clamp(t / 0.7, 0, 1);
  const tipX = lerp(startX, dendriteTipX, grow);

  ctx.save();
  ctx.strokeStyle = '#d49a8d';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(startX, cy);
  ctx.lineTo(tipX, cy);
  ctx.stroke();
  // small bouton at tip
  if (grow > 0.05) {
    const br = 3 + grow * 6;
    const fg = ctx.createRadialGradient(tipX, cy, 0, tipX, cy, br);
    fg.addColorStop(0, '#fae2d4');
    fg.addColorStop(1, '#c78373');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(tipX, cy, br, 0, Math.PI * 2); ctx.fill();
  }
  // when connected (t > 0.7), pink NT pulses
  if (t > 0.7) {
    const f = (t - 0.7) / 0.3;
    for (let i = 0; i < 4; i++) {
      const phase = (time / 80 + i * 0.7) % 1;
      const sx = lerp(tipX + 6, dendriteTipX, phase);
      ctx.fillStyle = `rgba(244, 114, 182, ${(1 - phase) * 0.85 * f})`;
      ctx.beginPath(); ctx.arc(sx, cy, 3, 0, Math.PI * 2); ctx.fill();
    }
    // success ring
    if (f > 0.5) {
      ctx.strokeStyle = `rgba(34, 197, 94, ${(1 - f) * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tipX, cy, 14 + f * 18, 0, Math.PI * 2); ctx.stroke();
    }
  }
  // labels
  ctx.fillStyle = 'rgba(220, 220, 230, 0.55)';
  ctx.font = '500 11px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('neuron A', ax, cy + 56);
  ctx.fillText('neuron B', bx, cy + 56);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.fillStyle = `rgba(34, 197, 94, ${0.6 + Math.sin(time / 400) * 0.25})`;
  ctx.fillText('a brand new synapse forms', (ax + bx) / 2, cy - 30);
  ctx.restore();
}

// ── Panel 2: STRENGTHEN — synapse grows bigger and fires faster ──
function panelStrengthen(ctx, px, py, pw, ph, time) {
  const cy = py + ph / 2 + 18;
  const ax = px + 130;
  const bx = px + pw - 130;
  // growth cycles 0..1 then resets
  const cycle = (time % 6000) / 6000;
  const growth = cycle; // 0 = thin, 1 = thick

  drawTinyNeuron(ctx, ax, cy, '#d49a8d', 1);
  drawTinyNeuron(ctx, bx, cy, '#9a7fc0', -1);

  ctx.save();
  // axon thickness scales with growth
  const lineW = lerp(3, 9, growth);
  ctx.strokeStyle = '#d49a8d';
  ctx.lineWidth = lineW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax + 13, cy);
  ctx.lineTo(bx - 12, cy);
  ctx.stroke();

  // bouton at end grows
  const br = lerp(5, 16, growth);
  const fg = ctx.createRadialGradient(bx - 18, cy, 0, bx - 18, cy, br);
  fg.addColorStop(0, '#fae2d4');
  fg.addColorStop(1, '#c78373');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(bx - 18, cy, br, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a86456';
  ctx.lineWidth = 1.5; ctx.stroke();

  // vesicle dots inside the bouton — count grows with strength
  const ves = Math.round(lerp(1, 7, growth));
  ctx.fillStyle = C_NT;
  for (let i = 0; i < ves; i++) {
    const a = i * 0.95;
    const r = br * 0.45;
    ctx.beginPath();
    ctx.arc(bx - 18 + Math.cos(a) * r, cy + Math.sin(a) * r, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // firing pulses — frequency scales with growth
  const pulseRate = lerp(900, 280, growth);
  for (let i = 0; i < 4; i++) {
    const phase = ((time + i * pulseRate / 2) % pulseRate) / pulseRate;
    const x = lerp(ax + 14, bx - 24, phase);
    const a = (1 - phase) * 0.85;
    ctx.fillStyle = `rgba(255, 209, 102, ${a})`;
    ctx.beginPath(); ctx.arc(x, cy, 2.5 + growth * 1.5, 0, Math.PI * 2); ctx.fill();
  }

  // caption
  ctx.fillStyle = 'rgba(220, 220, 230, 0.55)';
  ctx.font = '500 11px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('practiced often', ax + (bx - ax) / 2, cy + 56);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.fillStyle = `rgba(168, 85, 247, ${0.6 + growth * 0.3})`;
  ctx.fillText('bouton grows · more vesicles · faster firing', (ax + bx) / 2, cy - 30);
  ctx.restore();
}

// ── Panel 3: WEAKEN — synapse shrinks and prunes ──
function panelWeaken(ctx, px, py, pw, ph, time) {
  const cy = py + ph / 2 + 18;
  const ax = px + 130;
  const bx = px + pw - 130;
  // decay 1..0 then resets
  const cycle = (time % 5500) / 5500;
  let decay = 1 - cycle;
  if (decay < 0) decay = 0;

  drawTinyNeuron(ctx, ax, cy, '#d49a8d', 1);
  drawTinyNeuron(ctx, bx, cy, '#9a7fc0', -1);

  ctx.save();
  const lineW = lerp(2, 7, decay);
  ctx.strokeStyle = `rgba(212, 154, 141, ${0.3 + decay * 0.7})`;
  ctx.lineWidth = lineW;
  ctx.lineCap = 'round';
  // line breaks near the end
  const breakStart = decay < 0.4 ? lerp(ax + 13, bx - 24, 0.5) : bx - 24;
  ctx.beginPath();
  ctx.moveTo(ax + 13, cy);
  ctx.lineTo(breakStart, cy);
  ctx.stroke();

  // bouton shrinks then disappears
  if (decay > 0.15) {
    const br = lerp(3, 14, decay);
    const fg = ctx.createRadialGradient(bx - 18, cy, 0, bx - 18, cy, br);
    fg.addColorStop(0, `rgba(250, 226, 212, ${decay})`);
    fg.addColorStop(1, `rgba(199, 131, 115, ${decay})`);
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(bx - 18, cy, br, 0, Math.PI * 2); ctx.fill();
  }

  // dust particles drifting away when pruning
  if (decay < 0.5) {
    const fade = 1 - decay * 2;
    for (let i = 0; i < 5; i++) {
      const phase = (time / 60 + i * 0.7) % 1;
      const px2 = lerp(bx - 18, bx - 18 - 40, phase);
      const py2 = cy + (Math.random() - 0.5) * 2 + Math.sin(phase * Math.PI * 2 + i) * 8;
      ctx.fillStyle = `rgba(245, 158, 11, ${(1 - phase) * fade * 0.6})`;
      ctx.beginPath(); ctx.arc(px2, py2, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // labels
  ctx.fillStyle = 'rgba(220, 220, 230, 0.55)';
  ctx.font = '500 11px -apple-system, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('rarely used', ax + (bx - ax) / 2, cy + 56);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.fillStyle = `rgba(245, 158, 11, 0.85)`;
  ctx.fillText('the synapse shrinks · the connection prunes', (ax + bx) / 2, cy - 30);
  ctx.restore();
}

// ── Panel 4: MYELINATE — axon gains myelin, signal speeds up ──
function panelMyelinate(ctx, px, py, pw, ph, time) {
  const cy = py + ph / 2 + 18;
  const ax = px + 100;
  const bx = px + pw - 100;
  // gradually add myelin segments over the cycle
  const cycle = (time % 6000) / 6000;
  const myelinFraction = clamp(cycle * 1.4, 0, 1);

  drawTinyNeuron(ctx, ax, cy, '#d49a8d', 1);
  drawTinyNeuron(ctx, bx, cy, '#9a7fc0', -1);

  ctx.save();
  // bare axon
  ctx.strokeStyle = '#d49a8d';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax + 13, cy);
  ctx.lineTo(bx - 12, cy);
  ctx.stroke();

  // myelin segments — capsules along the axon
  const segs = 6;
  const segGap = 8;
  const totalLen = (bx - 12) - (ax + 20);
  const segLen = (totalLen - segGap * (segs - 1)) / segs;
  const startX = ax + 20;
  const visibleSegs = Math.floor(myelinFraction * segs);
  for (let i = 0; i < visibleSegs; i++) {
    const sx = startX + i * (segLen + segGap);
    const fadeIn = clamp((myelinFraction * segs - i), 0, 1);
    // myelin sheath capsule
    const mg = ctx.createLinearGradient(0, cy - 9, 0, cy + 9);
    mg.addColorStop(0, `rgba(245, 245, 250, ${fadeIn * 0.95})`);
    mg.addColorStop(0.5, `rgba(220, 220, 235, ${fadeIn * 0.9})`);
    mg.addColorStop(1, `rgba(180, 185, 210, ${fadeIn * 0.85})`);
    ctx.fillStyle = mg;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(sx, cy - 9, segLen, 18, 9); ctx.fill(); }
    ctx.strokeStyle = `rgba(150, 160, 200, ${fadeIn * 0.7})`;
    ctx.lineWidth = 1;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(sx, cy - 9, segLen, 18, 9); ctx.stroke(); }
  }

  // signal pulse — speed scales with myelin coverage
  const pulseSpeed = lerp(1.0, 3.5, myelinFraction);
  const pulseProg = ((time / 1400) * pulseSpeed) % 1;
  const pulseX = lerp(ax + 14, bx - 14, pulseProg);
  // glow
  const pg = ctx.createRadialGradient(pulseX, cy, 0, pulseX, cy, 22);
  pg.addColorStop(0, 'rgba(255, 240, 180, 0.95)');
  pg.addColorStop(0.4, 'rgba(255, 209, 102, 0.55)');
  pg.addColorStop(1, 'rgba(255, 209, 102, 0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(pulseX, cy, 22, 0, Math.PI * 2); ctx.fill();
  // bright core
  ctx.fillStyle = 'rgba(255, 255, 240, 0.95)';
  ctx.beginPath(); ctx.arc(pulseX, cy, 4, 0, Math.PI * 2); ctx.fill();

  // labels
  ctx.fillStyle = 'rgba(220, 220, 230, 0.55)';
  ctx.font = '500 11px -apple-system, system-ui';
  ctx.textAlign = 'center';
  const speedLabel = myelinFraction < 0.3 ? 'no myelin · slow' :
                     myelinFraction < 0.7 ? 'adding myelin · faster' :
                     'fully myelinated · fastest';
  ctx.fillText(speedLabel, (ax + bx) / 2, cy + 56);
  ctx.font = '600 12px -apple-system, system-ui';
  ctx.fillStyle = `rgba(92, 201, 255, 0.85)`;
  ctx.fillText('myelin sheaths grow on used pathways', (ax + bx) / 2, cy - 30);
  ctx.restore();
}

// =====================================================
//  SCENE 10: Common Neurotransmitters
// =====================================================
const sceneCommonNTs = {
  phase: 'Step 7: Common Neurotransmitters',
  phaseColor: '#a855f7',
  notes: "Same machinery, different chemicals. The neurotransmitter you release decides what the signal <em>does</em>. <strong>Dopamine</strong> drives motivation and reward. <strong>Serotonin</strong> stabilizes mood. <strong>Endorphins</strong> dull pain and create a natural high. <strong>Glutamate</strong> is the brain's GO signal. <strong>GABA</strong> is the brain's STOP signal. <strong>Acetylcholine</strong> moves muscles and sharpens attention.",
  notebook: "List all six neurotransmitters and the main job of each. Star one you have heard about before. These are the ones we will keep coming back to.",
  setup() {
    clearField();
    const cards = [
      { name: 'DOPAMINE',      role: 'motivation · reward · focus', color: '#f472b6' },
      { name: 'SEROTONIN',     role: 'mood · calm · sleep',         color: '#5cc9ff' },
      { name: 'ENDORPHINS',    role: 'pain relief · natural high',  color: '#ffd166' },
      { name: 'GLUTAMATE',     role: 'GO signal · info processing', color: '#ff7a6b' },
      { name: 'GABA',          role: 'STOP signal · calm',          color: '#5eead4' },
      { name: 'ACETYLCHOLINE', role: 'muscles · memory · attention',color: '#b084ff' }
    ];
    sceneLocal = {
      cards,
      time: 0,
      particles: cards.map(c => Array.from({ length: 7 }, () => ({
        x: Math.random() * 90,
        y: Math.random() * 90,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: 3 + Math.random() * 2,
        c: c.color
      })))
    };
  },
  update(dt) {
    sceneLocal.time += dt;
    sceneLocal.particles.forEach(group => {
      group.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > 90) p.vx *= -1;
        if (p.y < 0 || p.y > 90) p.vy *= -1;
      });
    });
  },
  draw(ctx, t) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    // Header
    ctx.save();
    ctx.fillStyle = 'rgba(245, 245, 245, 0.92)';
    ctx.font = '900 28px -apple-system, system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('COMMON NEUROTRANSMITTERS', W / 2, 50);
    ctx.font = '500 14px -apple-system, system-ui';
    ctx.fillStyle = 'rgba(160, 160, 160, 0.85)';
    ctx.fillText('different chemicals, different jobs', W / 2, 75);
    ctx.restore();

    // 2 rows × 3 cards
    const cardW = 480, cardH = 230, gap = 30;
    const startX = (W - 3 * cardW - 2 * gap) / 2;
    const startY = 105;

    sceneLocal.cards.forEach((card, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const cx = startX + col * (cardW + gap);
      const cy = startY + row * (cardH + gap);

      // card background
      ctx.fillStyle = 'rgba(20, 20, 20, 0.7)';
      ctx.strokeStyle = card.color + '88';
      ctx.lineWidth = 2;
      if (ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 14); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillRect(cx, cy, cardW, cardH);
        ctx.strokeRect(cx, cy, cardW, cardH);
      }

      // floating background particles
      const group = sceneLocal.particles[i];
      group.forEach(p => {
        const px = cx + 30 + p.x;
        const py = cy + 70 + p.y;
        const gr = ctx.createRadialGradient(px, py, 0, px, py, p.r * 4);
        gr.addColorStop(0, card.color + '70');
        gr.addColorStop(1, card.color + '00');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(px, py, p.r * 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = card.color;
        ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI * 2); ctx.fill();
      });

      // big NT ball
      const iconX = cx + 90, iconY = cy + cardH / 2;
      const pulse = (Math.sin(sceneLocal.time / 600 + i) + 1) * 0.5;
      const r = 30 + pulse * 4;
      const gg = ctx.createRadialGradient(iconX, iconY, 0, iconX, iconY, r * 2.2);
      gg.addColorStop(0, card.color + 'aa');
      gg.addColorStop(1, card.color + '00');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(iconX, iconY, r * 2.2, 0, Math.PI * 2); ctx.fill();
      const cgrad = ctx.createRadialGradient(iconX - r * 0.3, iconY - r * 0.3, 0, iconX, iconY, r);
      cgrad.addColorStop(0, 'rgba(255,255,255,0.95)');
      cgrad.addColorStop(0.4, card.color);
      cgrad.addColorStop(1, card.color);
      ctx.fillStyle = cgrad;
      ctx.beginPath(); ctx.arc(iconX, iconY, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1; ctx.stroke();

      // name
      ctx.fillStyle = card.color;
      ctx.font = '900 22px -apple-system, system-ui';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(card.name, cx + 160, cy + cardH / 2 - 16);

      // role
      ctx.fillStyle = 'rgba(245, 245, 245, 0.88)';
      ctx.font = '500 14px -apple-system, system-ui';
      ctx.fillText(card.role, cx + 160, cy + cardH / 2 + 12);
    });
  }
};

// =====================================================
//  SCENE 11: SSRIs / Zoloft
// =====================================================
const sceneSSRI = {
  phase: 'Step 8: Case Study · Medicine',
  phaseColor: '#7dd3fc',
  notes: "<strong>SSRIs</strong> are medications used to treat <strong>depression and anxiety</strong> by altering <strong>serotonin levels</strong> in the synapse. Common ones include <strong>Zoloft, Prozac, Paxil, Lexapro, and Celexa</strong>. They all work the same way. <strong>SSRIs do NOT make more serotonin.</strong> They keep the serotonin you already have around longer by <strong>blocking the transporter</strong> on the presynaptic neuron, which stops reuptake. The serotonin lingers in the synapse, binds receptors longer, and the mood signal lasts longer.",
  notebook: "Write: <strong>SSRI = Selective Serotonin Reuptake Inhibitor.</strong> List at least three SSRI brand names. Then explain: SSRIs treat depression and anxiety by blocking the transporter, which keeps serotonin in the synapse longer.",
  setup() {
    clearField();
    const nts = [];
    for (let i = 0; i < 22; i++) {
      const y = ACT_TOP + 14 + Math.random() * (ACT_BOT - ACT_TOP - 28);
      const x = PRE_MEM_X + 20 + Math.random() * (POST_MEM_X - PRE_MEM_X - 40);
      nts.push(new NT(x, y));
    }
    const receptors = RECEPTOR_YS.map(y => ({ y, bound: 0, target: 0, slot: null }));
    const transporters = TRANS_YS.map(y => ({ y, blocked: false }));
    const ssris = [];
    // a couple SSRI molecules drift in from above
    for (let i = 0; i < 2; i++) {
      ssris.push(new SSRI(900 + i * 200, -30 - i * 60));
    }
    sceneLocal = {
      nts, receptors, transporters, ssris,
      naIons: [], apTrains: [], apTimer: 0, sparkles: [],
      time: 0, blockingStarted: false
    };
  },
  update(dt) {
    sceneLocal.time += dt;

    // SSRI molecules drift in then dock to transporters after a short delay
    if (!sceneLocal.blockingStarted && sceneLocal.time > 800) {
      sceneLocal.blockingStarted = true;
      sceneLocal.ssris.forEach((s, i) => {
        const tr = sceneLocal.transporters[i];
        if (tr) {
          s.setTransit({ x: PRE_MEM_X + 14, y: tr.y }, 1.0 / 1000, tr);
        }
      });
    }
    sceneLocal.ssris.forEach(s => s.update(dt));

    // receptors bind NTs (same as interactive)
    sceneLocal.receptors.forEach(r => {
      if (r.slot == null && r.target < 0.5) {
        const candidate = sceneLocal.nts.find(n => n.state === 'free');
        if (candidate && Math.random() < 0.18) {
          const dest = { x: POST_MEM_X - 10, y: r.y };
          candidate.setTransit(dest, 1.5 / 1000, 'receptor', r);
          r.slot = candidate;
          r.target = 1;
        }
      }
      r.bound = lerp(r.bound, r.target, 0.06);
      // SSRI keeps NTs bound longer
      const longBond = sceneLocal.transporters.every(tr => tr.blocked) ? 2400 : 1300;
      if (r.slot && r.slot.state === 'bound' && r.slot.bondT > longBond) {
        r.slot.state = 'free';
        r.slot.vx = (Math.random() - 0.5) * 0.8;
        r.slot.vy = (Math.random() - 0.5) * 0.8;
        r.slot.x = POST_MEM_X - 25;
        r.slot.y = r.y + (Math.random() - 0.5) * 14;
        r.slot = null; r.target = 0; r.bound = 0;
      }
      if (r.bound > 0.6 && Math.random() < 0.07 * r.bound) {
        sceneLocal.naIons.push({
          x: POST_MEM_X + 22, y: r.y + (Math.random() - 0.5) * 26,
          vx: 0.6 + Math.random() * 0.7, vy: (Math.random() - 0.5) * 0.4, life: 1
        });
      }
    });

    // NO REUPTAKE (transporters blocked)

    sceneLocal.nts.forEach(n => n.update(dt));
    sceneLocal.naIons.forEach(n => { n.x += n.vx; n.y += n.vy; n.life -= 0.005; });
    sceneLocal.naIons = sceneLocal.naIons.filter(n => n.life > 0 && n.x < W);

    // post AP trains (more frequent because more bound)
    const boundCount = sceneLocal.receptors.filter(r => r.bound > 0.5).length;
    const interval = sceneLocal.transporters.every(tr => tr.blocked) ? 700 : 1500;
    sceneLocal.apTimer += dt;
    if (boundCount >= 2 && sceneLocal.apTimer > interval) {
      sceneLocal.apTimer = 0;
      sceneLocal.apTrains.push({ progress: 0 });
    }
    sceneLocal.apTrains.forEach(ap => { ap.progress += 0.0014 * dt; });
    sceneLocal.apTrains = sceneLocal.apTrains.filter(ap => ap.progress < 1.05);
    sceneLocal.apTrains.forEach(ap => {
      if (ap.progress < 1 && Math.random() < 0.4) {
        const x = lerp(POST_MEM_X + 60, W - 30, ap.progress);
        sceneLocal.sparkles.push({ x, y: MID + (Math.random() - 0.5) * 12, vx: (Math.random() - 0.5), vy: (Math.random() - 0.5), life: 1 });
      }
    });
    sceneLocal.sparkles.forEach(s => { s.x += s.vx; s.y += s.vy; s.life -= 0.04; });
    sceneLocal.sparkles = sceneLocal.sparkles.filter(s => s.life > 0);
  },
  draw(ctx, t) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    drawPresynapticTerminal(ctx);
    drawPostsynapticDendrite(ctx);
    sceneLocal.nts.forEach(n => n.draw(ctx));
    sceneLocal.receptors.forEach(r => drawReceptor(ctx, r.y, r.bound));
    CA_CHANNEL_YS.forEach(y => drawCalciumChannel(ctx, y, 0.3));
    // transporters drawn inactive when blocked
    sceneLocal.transporters.forEach(tr => drawTransporter(ctx, tr.y, tr.blocked ? 0 : 0.5, t));

    // SSRI molecules
    sceneLocal.ssris.forEach(s => s.draw(ctx));

    // BLOCKED indicator on each blocked transporter
    sceneLocal.transporters.forEach(tr => {
      if (tr.blocked) {
        ctx.save();
        // red X over the transporter mouth
        const x = PRE_MEM_X + 12;
        ctx.strokeStyle = 'rgba(255, 80, 80, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x - 12, tr.y - 12); ctx.lineTo(x + 12, tr.y + 12);
        ctx.moveTo(x + 12, tr.y - 12); ctx.lineTo(x - 12, tr.y + 12);
        ctx.stroke();
        // BLOCKED label
        ctx.fillStyle = '#ff5050';
        ctx.font = '700 11px -apple-system, system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('BLOCKED', x, tr.y - 30);
        ctx.restore();
      }
    });

    // Na ions
    sceneLocal.naIons.forEach(n => {
      ctx.save();
      ctx.globalAlpha = n.life;
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 16);
      g.addColorStop(0, 'rgba(255, 122, 107, 0.5)');
      g.addColorStop(1, 'rgba(255, 122, 107, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C_NA;
      ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '700 9px -apple-system, system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Na⁺', n.x, n.y);
      ctx.restore();
    });

    // AP bolts on post side
    sceneLocal.apTrains.forEach(ap => {
      drawLightningBolt(ctx, POST_MEM_X + 60, W - 30, MID, ap.progress, []);
    });
    sceneLocal.sparkles.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.life * 0.7;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 16);
      g.addColorStop(0, 'rgba(255,255,220,0.9)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // Case Study header
    ctx.save();
    // small "case study" tag
    ctx.font = '700 11px -apple-system, system-ui';
    ctx.fillStyle = 'rgba(125, 211, 252, 0.7)';
    ctx.textAlign = 'center';
    ctx.fillText('CASE STUDY · MEDICINE', CLEFT_MID, 28);
    // main title
    ctx.fillStyle = C_SSRI;
    ctx.font = '900 26px -apple-system, system-ui';
    ctx.fillText('SSRI', CLEFT_MID, 56);
    ctx.font = '500 12px -apple-system, system-ui';
    ctx.fillStyle = 'rgba(125, 211, 252, 0.85)';
    ctx.fillText('Selective Serotonin Reuptake Inhibitor', CLEFT_MID, 76);
    // brand names row
    ctx.font = '600 13px -apple-system, system-ui';
    ctx.fillStyle = 'rgba(245, 245, 245, 0.85)';
    ctx.fillText('Zoloft  ·  Prozac  ·  Paxil  ·  Lexapro  ·  Celexa', CLEFT_MID, 100);
    ctx.restore();

    // Footer note
    if (sceneLocal.blockingStarted) {
      ctx.save();
      ctx.fillStyle = 'rgba(125, 211, 252, 0.95)';
      ctx.font = '700 16px -apple-system, system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('reuptake blocked → serotonin stays in synapse longer → mood signal lasts longer', CLEFT_MID, H - 30);
      ctx.restore();
    }
  }
};

// =====================================================
//  Scenes list
// =====================================================
const scenes = [
  sceneNeuron,         // 1
  sceneSynapse,        // 2
  sceneCalcium,        // 3
  sceneReleaseBindFire,// 4 (combined release + bind + fire)
  sceneReuptake,       // 5
  sceneInteractive,    // 6
  sceneCommonNTs,      // 7
  sceneSSRI,           // 8
  sceneNeuroplasticity // 9
];

// =====================================================
//  UI
// =====================================================
const phaseNameEl = document.getElementById("phaseName");
const notesEl = document.getElementById("notes");
const stepHeadingEl = document.getElementById("stepHeading");
const notebookTextEl = document.getElementById("notebookText");
const stepIndicator = document.getElementById("stepIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");
const simControlsEl = document.getElementById("simControls");
const ntPlusBtn = document.getElementById("ntPlusBtn");
const ntMinusBtn = document.getElementById("ntMinusBtn");
const simReadout = document.getElementById("simReadout");

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function setScene(i) {
  currentSceneIdx = i;
  animT = 0;
  sceneFadeT = 0;
  const s = scenes[i];
  if (s.setup) s.setup();
  phaseNameEl.textContent = s.phase;
  phaseNameEl.style.color = s.phaseColor;
  notesEl.innerHTML = s.notes;
  stepHeadingEl.textContent = s.phase;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === scenes.length - 1;
  nextBtn.textContent = i === scenes.length - 1 ? 'Done' : 'Next →';
  if (s.isInteractive) simControlsEl.classList.add('visible');
  else simControlsEl.classList.remove('visible');
}

prevBtn.addEventListener("click", () => { if (currentSceneIdx > 0) setScene(currentSceneIdx - 1); });
nextBtn.addEventListener("click", () => { if (currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1); });
resetBtn.addEventListener("click", () => setScene(0));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" && currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1);
  if (e.key === "ArrowLeft" && currentSceneIdx > 0) setScene(currentSceneIdx - 1);
});
ntPlusBtn.addEventListener("click", () => {
  const s = scenes[currentSceneIdx];
  if (s.isInteractive && s.addNTs) { s.addNTs(8); updateSimReadout(); }
});
ntMinusBtn.addEventListener("click", () => {
  const s = scenes[currentSceneIdx];
  if (s.isInteractive && s.removeNTs) { s.removeNTs(8); updateSimReadout(); }
});
function updateSimReadout() {
  if (sceneLocal && sceneLocal.nts) simReadout.innerHTML = `NTs in cleft: <strong>${sceneLocal.nts.length}</strong>`;
}

// =====================================================
//  Main loop
// =====================================================
let lastTs = null;
function tick(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  animT += dt;
  sceneFadeT = Math.min(1, sceneFadeT + dt / 600);
  const s = scenes[currentSceneIdx];
  if (s.update) s.update(dt);
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = sceneFadeT;
  s.draw(ctx, animT);
  ctx.restore();
  if (s.isInteractive) updateSimReadout();
  requestAnimationFrame(tick);
}

setScene(0);
requestAnimationFrame(tick);
</script>
