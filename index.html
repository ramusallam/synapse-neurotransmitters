<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Synapse</title>
<style>
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #141414;
    --ink-hi: #f5f5f5;
    --ink-mid: #a0a0a0;
    --ink-low: #6b7280;
    --na: #ff7a6b;
    --k: #5cc9ff;
    --protein: #b084ff;
    --atp: #ffd166;
    --amber: #d4a554;
    --ca: #4ade80;
    --nt: #f472b6;
    --transporter: #5eead4;
    --accent: #6366f1;
    --panel: #141414;
    --panel-border: rgba(255,255,255,0.10);
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    padding: 14px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
  }
  header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .step-indicator {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink-low);
    letter-spacing: 1px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 20px;
  }
  .handbook-banner {
    margin: 0 auto 14px;
    padding: 9px 18px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.08), rgba(244, 114, 182, 0.06));
    border: 1px solid rgba(255, 209, 102, 0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    line-height: 1.4;
    color: #cfc5aa;
  }
  .handbook-banner .hb-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 4px 8px;
    background: rgba(255, 209, 102, 0.18);
    color: #ffd166;
    border-radius: 5px;
  }
  .handbook-banner strong { color: #ffd166; font-weight: 600; }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  canvas { display: block; width: 100%; height: auto; }
  .phase-bar {
    padding: 16px 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    border-top: 1px solid var(--panel-border);
    background: rgba(5, 8, 20, 0.4);
  }
  .phase-name {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.1px;
    color: var(--accent);
    transition: color 400ms ease;
  }
  .sim-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 250ms ease;
  }
  .sim-controls.visible { opacity: 1; pointer-events: auto; }
  .sim-controls .sim-readout {
    font-size: 14px;
    color: var(--ink-mid);
    letter-spacing: 0.2px;
    min-width: 180px;
    text-align: right;
  }
  .sim-controls .sim-readout strong {
    color: var(--nt);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }
  .sim-controls button.sim-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(244, 114, 182, 0.35);
    background: rgba(244, 114, 182, 0.08);
    color: #f9a8d4;
    cursor: pointer;
    transition: background 150ms, border-color 150ms;
  }
  .sim-controls button.sim-btn:hover { background: rgba(244, 114, 182, 0.18); border-color: rgba(244, 114, 182, 0.6); }
  .sim-controls button.sim-btn.minus {
    border-color: rgba(94, 234, 212, 0.35);
    background: rgba(94, 234, 212, 0.08);
    color: #99f6e4;
  }
  .sim-controls button.sim-btn.minus:hover { background: rgba(94, 234, 212, 0.18); border-color: rgba(94, 234, 212, 0.6); }
  .content { margin-top: 14px; }
  .notes-card {
    background: var(--note-bg);
    color: var(--note-ink);
    padding: 16px 22px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    box-shadow:
      0 14px 40px rgba(255, 209, 102, 0.08),
      inset 0 0 0 1px rgba(0,0,0,0.02);
  }
  .step-heading {
    font-weight: 700;
    font-size: 16px;
    color: #7a3a00;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }
  .notes-card p { margin: 0 0 6px; }
  .notes-card strong { font-weight: 700; color: #2a1e08; }

  .notebook-prompt {
    margin-top: 10px;
    padding: 12px 16px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.15), rgba(244, 114, 182, 0.12));
    border: 1.5px solid rgba(255, 209, 102, 0.45);
    border-left: 5px solid #ffd166;
    border-radius: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: #f3d589;
  }
  .notebook-prompt .np-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 9px;
    background: #ffd166;
    color: #2a1e08;
    border-radius: 5px;
    margin-top: 1px;
  }
  .notebook-prompt strong { color: #ffd166; font-weight: 700; }

  nav {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: background 150ms, transform 50ms, border-color 150ms;
  }
  button:hover:not(:disabled) {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    color: #f5f5ff;
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.25);
  }
  button.primary:hover { filter: brightness(1.08); }
  .btn-group { display: flex; gap: 10px; }
  @media (max-width: 720px) {
    .phase-bar { grid-template-columns: 1fr; }
    .sim-controls { justify-content: space-between; }
    .phase-name { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">The Synapse</div>
  <div class="step-indicator" id="stepIndicator">01 / 10</div>
</header>

<main>
  <div class="stage">
    <canvas id="canvas" width="1600" height="650"></canvas>
    <div class="phase-bar">
      <div class="phase-name" id="phaseName">Step 1</div>
      <div class="sim-controls" id="simControls">
        <button class="sim-btn minus" id="ntMinusBtn">− Remove NTs</button>
        <button class="sim-btn" id="ntPlusBtn">+ Add NTs</button>
        <div class="sim-readout" id="simReadout">NTs in cleft: <strong>20</strong></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="notes-card">
      <div class="step-heading" id="stepHeading">Step 1</div>
      <p id="notes"></p>
    </div>
    <div class="notebook-prompt" id="notebookPrompt">
      <div class="np-tag">✎ NOTES</div>
      <div id="notebookText"></div>
    </div>
  </div>

  <nav>
    <button id="resetBtn">Start Over</button>
    <div class="btn-group">
      <button id="prevBtn">← Back</button>
      <button id="nextBtn" class="primary">Next →</button>
    </div>
  </nav>
</main>

<script>
// =====================================================
//  Canvas setup
// =====================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;   // 1600
const H = canvas.height;  // 650
const MID = H / 2;        // 325

// Synapse layout — flat parallel cleft
const PRE_MEM_X = 720;    // presynaptic membrane facing cleft (vertical line)
const POST_MEM_X = 880;   // postsynaptic membrane facing cleft
const CLEFT_MID = (PRE_MEM_X + POST_MEM_X) / 2;
const ACT_TOP = 215;      // active zone top
const ACT_BOT = 435;      // active zone bottom

// Colors
const C_NA = '#ff7a6b';
const C_K = '#5cc9ff';
const C_PROT = '#b084ff';
const C_ATP = '#ffd166';
const C_ACCENT = '#6366f1';
const C_CA = '#4ade80';
const C_CA_GLOW = 'rgba(74, 222, 128,';
const C_NT = '#f472b6';
const C_NT_GLOW = 'rgba(244, 114, 182,';
const C_TRANS = '#5eead4';
const C_TRANS_GLOW = 'rgba(94, 234, 212,';
const C_SSRI = '#7dd3fc';

// =====================================================
//  Helpers
// =====================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function seededRng(seed) {
  let s = seed;
  return function() { s = (s * 16807) % 2147483647; return s / 2147483647; };
}

function buildDendriteTree(x0, y0, angle, length, depth, rng, segments = []) {
  if (depth === 0 || length < 18) return segments;
  const endX = x0 + Math.cos(angle) * length;
  const endY = y0 + Math.sin(angle) * length;
  const cpX = x0 + Math.cos(angle) * length * 0.5 + (rng() - 0.5) * 30;
  const cpY = y0 + Math.sin(angle) * length * 0.5 + (rng() - 0.5) * 30;
  segments.push({ x1: x0, y1: y0, cx: cpX, cy: cpY, x2: endX, y2: endY, w: depth * 2 });
  const branchAngle = 0.45 + rng() * 0.3;
  const lenScale = 0.6 + rng() * 0.15;
  buildDendriteTree(endX, endY, angle - branchAngle, length * lenScale, depth - 1, rng, segments);
  buildDendriteTree(endX, endY, angle + branchAngle, length * lenScale, depth - 1, rng, segments);
  if (rng() > 0.6) {
    buildDendriteTree(endX, endY, angle + (rng() - 0.5) * 0.3, length * 0.5, depth - 1, rng, segments);
  }
  return segments;
}

// =====================================================
//  Full neuron renderer (matches Action Potential app)
// =====================================================
function drawFullNeuron(ctx, opts = {}) {
  const rng = seededRng(7);
  const soma = { x: 340, y: MID };
  const trees = [
    buildDendriteTree(soma.x - 70, soma.y - 85, -Math.PI * 0.72, 130, 4, rng),
    buildDendriteTree(soma.x - 95, soma.y - 35, -Math.PI * 0.92, 120, 4, rng),
    buildDendriteTree(soma.x - 98, soma.y + 25, Math.PI * 0.94, 120, 4, rng),
    buildDendriteTree(soma.x - 70, soma.y + 85, Math.PI * 0.72, 130, 4, rng),
    buildDendriteTree(soma.x - 30, soma.y - 100, -Math.PI * 0.55, 110, 3, rng),
    buildDendriteTree(soma.x - 30, soma.y + 100, Math.PI * 0.55, 110, 3, rng)
  ];
  ctx.lineCap = 'round';
  trees.forEach(tree => {
    tree.forEach(seg => {
      ctx.strokeStyle = `rgba(209, 154, 143, ${0.55 + seg.w * 0.05})`;
      ctx.lineWidth = seg.w;
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.quadraticCurveTo(seg.cx, seg.cy, seg.x2, seg.y2);
      ctx.stroke();
    });
  });
  const glow = ctx.createRadialGradient(soma.x, soma.y, 0, soma.x, soma.y, 180);
  glow.addColorStop(0, 'rgba(245, 208, 197, 0.16)');
  glow.addColorStop(1, 'rgba(245, 208, 197, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(soma.x, soma.y, 180, 0, Math.PI * 2); ctx.fill();
  const somaFill = ctx.createRadialGradient(soma.x - 25, soma.y - 25, 10, soma.x, soma.y, 120);
  somaFill.addColorStop(0, '#f8d9ce');
  somaFill.addColorStop(0.7, '#d49a8d');
  somaFill.addColorStop(1, '#a86456');
  ctx.fillStyle = somaFill;
  ctx.beginPath();
  ctx.moveTo(soma.x - 95, soma.y + 5);
  ctx.bezierCurveTo(soma.x - 100, soma.y - 70, soma.x - 30, soma.y - 105, soma.x + 25, soma.y - 95);
  ctx.bezierCurveTo(soma.x + 85, soma.y - 85, soma.x + 110, soma.y - 30, soma.x + 105, soma.y + 5);
  ctx.bezierCurveTo(soma.x + 110, soma.y + 50, soma.x + 60, soma.y + 95, soma.x + 5, soma.y + 100);
  ctx.bezierCurveTo(soma.x - 55, soma.y + 105, soma.x - 95, soma.y + 65, soma.x - 95, soma.y + 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.7)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#8f4c3e';
  ctx.beginPath(); ctx.arc(soma.x - 8, soma.y - 8, 36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a2a1e';
  ctx.beginPath(); ctx.arc(soma.x + 2, soma.y - 2, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d49a8d';
  ctx.beginPath();
  ctx.moveTo(soma.x + 95, soma.y - 28);
  ctx.lineTo(soma.x + 95, soma.y + 28);
  ctx.lineTo(soma.x + 170, soma.y + 14);
  ctx.lineTo(soma.x + 170, soma.y - 14);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.6)';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = '#d49a8d';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(soma.x + 170, soma.y);
  ctx.bezierCurveTo(soma.x + 430, soma.y - 14, soma.x + 760, soma.y + 14, W - 260, soma.y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 220, 208, 0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(soma.x + 170, soma.y - 9);
  ctx.bezierCurveTo(soma.x + 430, soma.y - 23, soma.x + 760, soma.y + 5, W - 260, soma.y - 9);
  ctx.stroke();
  const termX = W - 260;
  const termAngles = [-0.55, -0.28, -0.05, 0.22, 0.5, -0.42, 0.38];
  termAngles.forEach((a, i) => {
    const len = 120 + (i % 3) * 20;
    ctx.strokeStyle = '#d49a8d';
    ctx.lineWidth = 10 + (i % 2) * 3;
    ctx.beginPath();
    ctx.moveTo(termX, soma.y);
    const mx = termX + Math.cos(a) * len * 0.55;
    const my = soma.y + Math.sin(a) * len * 0.55 + (i % 2 === 0 ? 8 : -8);
    const ex = termX + Math.cos(a) * len;
    const ey = soma.y + Math.sin(a) * len;
    ctx.quadraticCurveTo(mx, my, ex, ey);
    ctx.stroke();
    const bg = ctx.createRadialGradient(ex - 3, ey - 3, 2, ex, ey, 18);
    bg.addColorStop(0, '#fae2d4'); bg.addColorStop(1, '#c78373');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(ex, ey, 14 + (i % 3) * 2, 0, Math.PI * 2); ctx.fill();
  });
  return { soma, termX };
}

// =====================================================
//  Lightning bolt along the axon
// =====================================================
function drawLightningBolt(ctx, startX, endX, baseY, progress, sparkles) {
  const segs = 22;
  const points = [];
  for (let i = 0; i <= segs; i++) {
    const f = i / segs;
    const x = lerp(startX, endX, f);
    const baseOffsetY = Math.sin(f * Math.PI * 2.2) * 6;
    const jag = (Math.random() - 0.5) * 14;
    points.push({ x, y: baseY + baseOffsetY + jag * (f < progress ? 1 : 0) });
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 209, 102, 0.5)';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowBlur = 28;
  ctx.shadowColor = 'rgba(255, 209, 102, 0.9)';
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const f = i / segs; if (f > progress) break;
    const p = points[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.shadowBlur = 14;
  ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const f = i / segs; if (f > progress) break;
    const p = points[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.restore();
  // sparkles
  if (sparkles) {
    sparkles.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.life * 0.8;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 18);
      g.addColorStop(0, 'rgba(255,255,220,0.9)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }
}

// =====================================================
//  Synapse: bouton + dendrite drawing
// =====================================================
function drawPresynapticTerminal(ctx, opts = {}) {
  const cx = 470, cy = MID;
  ctx.save();
  // axon trail entering from far left (thin horizontal tube)
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, MID);
  ctx.lineTo(220, MID);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 220, 208, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, MID - 14);
  ctx.lineTo(220, MID - 14);
  ctx.stroke();

  // glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 380);
  glow.addColorStop(0, 'rgba(245, 208, 197, 0.10)');
  glow.addColorStop(1, 'rgba(245, 208, 197, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, 380, 0, Math.PI * 2); ctx.fill();

  // bouton — bulb on a neck (mushroom / bowling-pin shape)
  const fill = ctx.createRadialGradient(cx - 50, cy - 60, 20, cx, cy, 300);
  fill.addColorStop(0, '#f8d9ce');
  fill.addColorStop(0.5, '#d49a8d');
  fill.addColorStop(1, '#a86456');
  ctx.fillStyle = fill;
  ctx.beginPath();
  // back of bouton (axon attachment) — narrow neck
  ctx.moveTo(200, MID - 20);
  // upper neck widening
  ctx.bezierCurveTo(260, MID - 32, 290, MID - 70, 320, MID - 130);
  // upper bulb shoulder, sweeping up and out
  ctx.bezierCurveTo(360, MID - 200, 510, MID - 230, 620, MID - 200);
  // upper face curve
  ctx.bezierCurveTo(690, MID - 175, 720, MID - 145, 720, MID - 110);
  // active zone face — straight vertical
  ctx.lineTo(720, MID + 110);
  // lower face curve
  ctx.bezierCurveTo(720, MID + 145, 690, MID + 175, 620, MID + 200);
  // lower bulb shoulder
  ctx.bezierCurveTo(510, MID + 230, 360, MID + 200, 320, MID + 130);
  // lower neck back to axon
  ctx.bezierCurveTo(290, MID + 70, 260, MID + 32, 200, MID + 20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 75, 60, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // membrane highlight on active zone (right edge)
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(720, MID - 110);
  ctx.lineTo(720, MID + 110);
  ctx.stroke();

  ctx.restore();
}

function drawPostsynapticDendrite(ctx, opts = {}) {
  const cx = 1130, cy = MID;
  ctx.save();
  // dendrite trailing off to right (thin horizontal tube)
  ctx.strokeStyle = '#9a7fc0';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(W - 220, MID);
  ctx.lineTo(W, MID);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(220, 200, 240, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W - 220, MID - 14);
  ctx.lineTo(W, MID - 14);
  ctx.stroke();

  // glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 380);
  glow.addColorStop(0, 'rgba(176, 132, 255, 0.10)');
  glow.addColorStop(1, 'rgba(176, 132, 255, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, 380, 0, Math.PI * 2); ctx.fill();

  // dendrite spine head — mirrored bulb on a neck
  const fill = ctx.createRadialGradient(cx + 50, cy - 60, 20, cx, cy, 300);
  fill.addColorStop(0, '#d4c0ee');
  fill.addColorStop(0.5, '#9a7fc0');
  fill.addColorStop(1, '#705396');
  ctx.fillStyle = fill;
  ctx.beginPath();
  // back of dendrite spine (dendrite attachment) — narrow neck
  ctx.moveTo(W - 200, MID - 20);
  ctx.bezierCurveTo(W - 260, MID - 32, W - 290, MID - 70, W - 320, MID - 130);
  ctx.bezierCurveTo(W - 360, MID - 200, W - 510, MID - 230, W - 620, MID - 200);
  ctx.bezierCurveTo(W - 690, MID - 175, W - 720, MID - 145, W - 720, MID - 110);
  // active zone face — straight vertical at x=880
  ctx.lineTo(880, MID + 110);
  ctx.bezierCurveTo(W - 720, MID + 145, W - 690, MID + 175, W - 620, MID + 200);
  ctx.bezierCurveTo(W - 510, MID + 230, W - 360, MID + 200, W - 320, MID + 130);
  ctx.bezierCurveTo(W - 290, MID + 70, W - 260, MID + 32, W - 200, MID + 20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(80, 60, 110, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // membrane highlight on active zone (left edge)
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(880, MID - 110);
  ctx.lineTo(880, MID + 110);
  ctx.stroke();

  ctx.restore();
}

// =====================================================
//  Synapse parts: Ca channel, Receptor (ball-socket), Transporter (vacuum)
// =====================================================
function drawCalciumChannel(ctx, y, openness) {
  const x = PRE_MEM_X;
  const halfH = 26;
  ctx.save();
  // base embedded in membrane, mostly inside bouton
  const base = ctx.createLinearGradient(x - 18, 0, x + 18, 0);
  base.addColorStop(0, 'rgba(20, 35, 25, 0.95)');
  base.addColorStop(0.5, 'rgba(15, 25, 20, 0.98)');
  base.addColorStop(1, 'rgba(20, 35, 25, 0.95)');
  ctx.fillStyle = base;
  roundRect(ctx, x - 22, y - halfH, 44, halfH * 2, 8);
  ctx.fill();
  ctx.strokeStyle = openness > 0.3 ? C_CA : 'rgba(120, 200, 150, 0.45)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // gates open as channel activates
  const gap = openness * 14;
  ctx.fillStyle = openness > 0.3 ? `rgba(74, 222, 128, ${0.55 + openness * 0.4})` : 'rgba(74, 222, 128, 0.28)';
  ctx.beginPath(); ctx.ellipse(x - 12 + gap, y - halfH + 9, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 12 - gap, y + halfH - 9, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  // label
  ctx.fillStyle = 'rgba(74, 222, 128, 0.95)';
  ctx.font = '700 11px -apple-system, system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Ca²⁺', x, y);
  ctx.restore();
}

// Receptor — Y-cup with circular socket facing cleft. NT ball drops into the socket.
function drawReceptor(ctx, y, boundFraction) {
  const x = POST_MEM_X;
  ctx.save();

  // trunk embedded in dendrite — gradient depth
  const trunkGrad = ctx.createLinearGradient(x, 0, x + 22, 0);
  trunkGrad.addColorStop(0, 'rgba(90, 65, 140, 0.98)');
  trunkGrad.addColorStop(1, 'rgba(50, 35, 90, 0.98)');
  ctx.fillStyle = trunkGrad;
  roundRect(ctx, x, y - 18, 22, 36, 6);
  ctx.fill();

  // cup arms with gradient and binding-aware color
  const armBase = boundFraction > 0.5 ? '#c4a3ff' : '#9a7fc0';
  const armDark = boundFraction > 0.5 ? '#8a64d8' : '#604584';
  const armGrad = ctx.createLinearGradient(x - 22, 0, x + 2, 0);
  armGrad.addColorStop(0, armBase);
  armGrad.addColorStop(1, armDark);
  ctx.fillStyle = armGrad;
  // top arm
  ctx.beginPath();
  ctx.moveTo(x + 2, y - 22);
  ctx.lineTo(x - 22, y - 16);
  ctx.lineTo(x - 22, y - 6);
  ctx.lineTo(x + 2, y - 4);
  ctx.closePath();
  ctx.fill();
  // bottom arm
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 22);
  ctx.lineTo(x - 22, y + 16);
  ctx.lineTo(x - 22, y + 6);
  ctx.lineTo(x + 2, y + 4);
  ctx.closePath();
  ctx.fill();
  // arm highlight
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 22, y - 16); ctx.lineTo(x + 2, y - 22);
  ctx.moveTo(x - 22, y + 16); ctx.lineTo(x + 2, y + 22);
  ctx.stroke();

  if (boundFraction < 0.5) {
    // EMPTY — dark socket with subtle inner shadow
    const sg = ctx.createRadialGradient(x - 12, y - 2, 0, x - 10, y, 10);
    sg.addColorStop(0, 'rgba(60, 40, 90, 0.98)');
    sg.addColorStop(1, 'rgba(20, 12, 40, 0.98)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(x - 10, y, 9, 0, Math.PI * 2); ctx.fill();
    // rim
    ctx.strokeStyle = 'rgba(176, 132, 255, 0.65)';
    ctx.lineWidth = 1.5; ctx.stroke();
    // subtle idle pulse ring
    const idle = (Math.sin((animT || 0) / 700 + y * 0.03) + 1) * 0.5;
    ctx.strokeStyle = `rgba(176, 132, 255, ${0.15 + idle * 0.15})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x - 10, y, 11 + idle * 2, 0, Math.PI * 2); ctx.stroke();
  } else {
    // BOUND — NT ball sits in socket
    const f = boundFraction;
    // Binding pulse ring (recently formed binding)
    const bindPulse = (Math.sin((animT || 0) / 220 + y * 0.04) + 1) * 0.5;
    ctx.strokeStyle = `rgba(244, 114, 182, ${(0.3 + bindPulse * 0.3) * f})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x - 10, y, 14 + bindPulse * 4, 0, Math.PI * 2); ctx.stroke();
    // Outer pink glow
    const gg = ctx.createRadialGradient(x - 10, y, 0, x - 10, y, 30);
    gg.addColorStop(0, `rgba(244, 114, 182, ${f * 0.6})`);
    gg.addColorStop(1, 'rgba(244, 114, 182, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x - 10, y, 30, 0, Math.PI * 2); ctx.fill();
    // NT ball with detailed gradient
    const cg = ctx.createRadialGradient(x - 12.5, y - 2.5, 0, x - 10, y, 8);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.35, C_NT);
    cg.addColorStop(1, '#a02868');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(x - 10, y, 8, 0, Math.PI * 2); ctx.fill();
    // tiny specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(x - 12, y - 2, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Reuptake transporter — protein channel with breathing pull, mouth facing cleft
function drawTransporter(ctx, y, active, t) {
  const x = PRE_MEM_X;
  ctx.save();

  const phase = (t || 0) / 380 + y * 0.04;
  const breath = (Math.sin(phase) + 1) * 0.5; // 0..1 slow

  // soft outer halo when active (concentric breathing pulses)
  if (active > 0.3) {
    for (let i = 0; i < 3; i++) {
      const off = ((phase * 0.5 + i * 0.33) % 1);
      const r = 14 + off * 28;
      const a = (1 - off) * 0.18 * active;
      ctx.fillStyle = `rgba(94, 234, 212, ${a})`;
      ctx.beginPath(); ctx.arc(x + 8, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // trunk inside bouton (with subtle gradient depth)
  const trunkGrad = ctx.createLinearGradient(x - 22, 0, x, 0);
  trunkGrad.addColorStop(0, 'rgba(12, 36, 38, 0.98)');
  trunkGrad.addColorStop(1, 'rgba(28, 64, 64, 0.98)');
  ctx.fillStyle = trunkGrad;
  roundRect(ctx, x - 22, y - 18, 22, 36, 6);
  ctx.fill();

  // outer arms with gradient (face into cleft)
  const armGrad = ctx.createLinearGradient(x, 0, x + 22, 0);
  if (active > 0.4) {
    armGrad.addColorStop(0, 'rgba(56, 178, 172, 1)');
    armGrad.addColorStop(1, 'rgba(94, 234, 212, 1)');
  } else {
    armGrad.addColorStop(0, 'rgba(56, 178, 172, 0.6)');
    armGrad.addColorStop(1, 'rgba(94, 234, 212, 0.7)');
  }
  ctx.fillStyle = armGrad;
  // top arm
  ctx.beginPath();
  ctx.moveTo(x - 2, y - 22);
  ctx.lineTo(x + 22, y - 16);
  ctx.lineTo(x + 22, y - 6);
  ctx.lineTo(x - 2, y - 4);
  ctx.closePath();
  ctx.fill();
  // bottom arm
  ctx.beginPath();
  ctx.moveTo(x - 2, y + 22);
  ctx.lineTo(x + 22, y + 16);
  ctx.lineTo(x + 22, y + 6);
  ctx.lineTo(x - 2, y + 4);
  ctx.closePath();
  ctx.fill();

  // arm highlight (top edge, soft white)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 2, y - 22); ctx.lineTo(x + 22, y - 16);
  ctx.moveTo(x - 2, y + 22); ctx.lineTo(x + 22, y + 16);
  ctx.stroke();

  // dark interior pore with depth gradient
  const poreGrad = ctx.createLinearGradient(x - 2, 0, x + 22, 0);
  poreGrad.addColorStop(0, 'rgba(4, 14, 14, 1)');
  poreGrad.addColorStop(1, 'rgba(20, 50, 50, 0.9)');
  ctx.fillStyle = poreGrad;
  ctx.beginPath();
  ctx.moveTo(x - 2, y - 4);
  ctx.lineTo(x + 22, y - 4);
  ctx.lineTo(x + 22, y + 4);
  ctx.lineTo(x - 2, y + 4);
  ctx.closePath();
  ctx.fill();

  // when active, draw a flowing inward streak inside the pore
  if (active > 0.3) {
    const flow = (phase * 0.8) % 1;
    for (let i = 0; i < 3; i++) {
      const f = (flow + i * 0.33) % 1;
      const sx = x + 22 - f * 26; // moves from right (cleft) to left (interior)
      const a = Math.sin(f * Math.PI) * 0.85 * active;
      ctx.fillStyle = `rgba(180, 255, 240, ${a})`;
      ctx.beginPath();
      ctx.ellipse(sx, y, 3, 1.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // inward chevron at the pore exit
    ctx.fillStyle = `rgba(180, 255, 240, ${0.5 + breath * 0.4})`;
    ctx.beginPath();
    ctx.moveTo(x + 4, y - 5);
    ctx.lineTo(x - 4, y);
    ctx.lineTo(x + 4, y + 5);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Vesicle — sphere full of NT dots
function drawVesicle(ctx, x, y, r, fuseFraction) {
  if (fuseFraction >= 1) return;
  ctx.save();
  ctx.globalAlpha = 1 - fuseFraction;
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
  g.addColorStop(0, 'rgba(255, 245, 220, 0.95)');
  g.addColorStop(0.7, 'rgba(255, 220, 170, 0.7)');
  g.addColorStop(1, 'rgba(212, 165, 84, 0.5)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * (1 + fuseFraction * 0.3), 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 209, 102, 0.85)';
  ctx.lineWidth = 1.5; ctx.stroke();
  // NTs inside
  ctx.fillStyle = C_NT;
  for (let i = 0; i < 5; i++) {
    const a = i * 1.25;
    const rr = r * 0.5;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// =====================================================
//  Particles
// =====================================================
class NT {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.r = 7;
    this.state = 'free'; // free, transitTo, bound, recycled
    this.bondT = 0;
    this.target = null;
    this.pathT = 0; this.pathSpeed = 0;
    this.pathStart = null; this.pathEnd = null;
    this.boundReceptor = null;
    this.trail = [];
  }
  update(dt) {
    this.trail.unshift({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.pop();
    if (this.state === 'transitTo') {
      this.pathT += this.pathSpeed * dt;
      if (this.pathT >= 1) {
        this.pathT = 1;
        this.x = this.pathEnd.x; this.y = this.pathEnd.y;
        if (this.target === 'receptor' && this.boundReceptor) {
          this.state = 'bound'; this.bondT = 0;
        } else if (this.target === 'reuptake') {
          this.state = 'recycled';
        } else {
          this.state = 'free';
          this.vx = (Math.random() - 0.5) * 1.0;
          this.vy = (Math.random() - 0.5) * 1.0;
        }
        return;
      }
      const tt = this.pathT;
      const ease = tt * tt * (3 - 2 * tt);
      this.x = lerp(this.pathStart.x, this.pathEnd.x, ease);
      this.y = lerp(this.pathStart.y, this.pathEnd.y, ease);
      return;
    }
    if (this.state === 'bound') { this.bondT += dt; return; }
    if (this.state === 'recycled') return;
    // free drift
    this.vx += (Math.random() - 0.5) * 0.18;
    this.vy += (Math.random() - 0.5) * 0.18;
    this.vx *= 0.95;
    this.vy *= 0.95;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 1.0) { this.vx = this.vx / sp * 1.0; this.vy = this.vy / sp * 1.0; }
    this.x += this.vx; this.y += this.vy;
    if (this.y < ACT_TOP + 12) { this.y = ACT_TOP + 12; this.vy = Math.abs(this.vy); }
    if (this.y > ACT_BOT - 12) { this.y = ACT_BOT - 12; this.vy = -Math.abs(this.vy); }
    if (this.x < PRE_MEM_X + this.r + 4) { this.x = PRE_MEM_X + this.r + 4; this.vx = Math.abs(this.vx); }
    if (this.x > POST_MEM_X - this.r - 4) { this.x = POST_MEM_X - this.r - 4; this.vx = -Math.abs(this.vx); }
  }
  setTransit(end, speed, target, receptor) {
    this.state = 'transitTo';
    this.pathStart = { x: this.x, y: this.y };
    this.pathEnd = end;
    this.pathT = 0; this.pathSpeed = speed;
    this.target = target;
    this.boundReceptor = receptor || null;
  }
  draw(ctx) {
    if (this.state === 'recycled') return;
    if (this.state === 'bound') return; // receptor draws the bound ball
    ctx.save();
    for (let i = this.trail.length - 1; i > 0; i--) {
      const p = this.trail[i];
      const a = (1 - i / this.trail.length) * 0.18;
      ctx.fillStyle = C_NT_GLOW + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, this.r * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 2.4);
    g.addColorStop(0, C_NT_GLOW + '0.55)');
    g.addColorStop(0.5, C_NT_GLOW + '0.2)');
    g.addColorStop(1, C_NT_GLOW + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.4, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createRadialGradient(this.x - this.r * 0.3, this.y - this.r * 0.3, 0, this.x, this.y, this.r);
    cg.addColorStop(0, 'rgba(255,255,255,0.95)');
    cg.addColorStop(0.3, C_NT);
    cg.addColorStop(1, '#be3879');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}

class Calcium {
  constructor(x, y, region) {
    this.x = x; this.y = y;
    this.region = region;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.r = 8;
    this.state = 'free';
    this.pathT = 0; this.pathSpeed = 0;
    this.pathStart = null; this.pathEnd = null;
    this.trail = [];
  }
  update(dt) {
    this.trail.unshift({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.pop();
    if (this.state === 'transit') {
      this.pathT += this.pathSpeed * dt;
      if (this.pathT >= 1) {
        this.pathT = 1; this.x = this.pathEnd.x; this.y = this.pathEnd.y;
        this.state = 'free'; this.region = 'inside';
        this.vx = (Math.random() - 0.5) * 1.4;
        this.vy = (Math.random() - 0.5) * 1.4;
        return;
      }
      const tt = this.pathT;
      const ease = tt * tt * (3 - 2 * tt);
      this.x = lerp(this.pathStart.x, this.pathEnd.x, ease);
      this.y = lerp(this.pathStart.y, this.pathEnd.y, ease);
      return;
    }
    this.vx += (Math.random() - 0.5) * 0.2;
    this.vy += (Math.random() - 0.5) * 0.2;
    this.vx *= 0.94; this.vy *= 0.94;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 1.4) { this.vx = this.vx / sp * 1.4; this.vy = this.vy / sp * 1.4; }
    this.x += this.vx; this.y += this.vy;
    if (this.region === 'outside') {
      if (this.y < ACT_TOP + 12) { this.y = ACT_TOP + 12; this.vy = Math.abs(this.vy); }
      if (this.y > ACT_BOT - 12) { this.y = ACT_BOT - 12; this.vy = -Math.abs(this.vy); }
      if (this.x < PRE_MEM_X + this.r + 4) { this.x = PRE_MEM_X + this.r + 4; this.vx = Math.abs(this.vx); }
      if (this.x > POST_MEM_X - this.r - 4) { this.x = POST_MEM_X - this.r - 4; this.vx = -Math.abs(this.vx); }
    } else {
      if (this.y < ACT_TOP + 12) { this.y = ACT_TOP + 12; this.vy = Math.abs(this.vy); }
      if (this.y > ACT_BOT - 12) { this.y = ACT_BOT - 12; this.vy = -Math.abs(this.vy); }
      if (this.x < 320) { this.x = 320; this.vx = Math.abs(this.vx); }
      if (this.x > PRE_MEM_X - this.r - 8) { this.x = PRE_MEM_X - this.r - 8; this.vx = -Math.abs(this.vx); }
    }
  }
  setTransit(end, speed) {
    this.state = 'transit';
    this.pathStart = { x: this.x, y: this.y };
    this.pathEnd = end;
    this.pathT = 0; this.pathSpeed = speed;
  }
  draw(ctx) {
    ctx.save();
    for (let i = this.trail.length - 1; i > 0; i--) {
      const p = this.trail[i];
      const a = (1 - i / this.trail.length) * 0.18;
      ctx.fillStyle = C_CA_GLOW + a + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, this.r * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 2.5);
    g.addColorStop(0, C_CA_GLOW + '0.55)');
    g.addColorStop(0.5, C_CA_GLOW + '0.2)');
    g.addColorStop(1, C_CA_GLOW + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createRadialGradient(this.x - this.r * 0.3, this.y - this.r * 0.3, 0, this.x, this.y, this.r);
    cg.addColorStop(0, 'rgba(255,255,255,0.9)');
    cg.addColorStop(0.3, C_CA);
    cg.addColorStop(1, '#22a55a');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '700 9px -apple-system, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Ca²⁺', this.x, this.y + 0.5);
    ctx.restore();
  }
}

class Vesicle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 18;
    this.state = 'rest';
    this.dockTarget = null;
    this.dockT = 0;
    this.fuseT = 0;
  }
  update(dt) {
    if (this.state === 'docking') {
      this.dockT += dt / 800;
      if (this.dockT >= 1) {
        this.dockT = 1;
        this.x = this.dockTarget.x; this.y = this.dockTarget.y;
        this.state = 'fused';
      } else {
        const t = this.dockT * this.dockT * (3 - 2 * this.dockT);
        this.x = lerp(this.x0, this.dockTarget.x, t);
        this.y = lerp(this.y0, this.dockTarget.y, t);
      }
    } else if (this.state === 'fused') {
      this.fuseT += dt / 600;
      if (this.fuseT > 1) this.fuseT = 1;
    } else {
      this.x += (Math.random() - 0.5) * 0.3;
      this.y += (Math.random() - 0.5) * 0.3;
    }
  }
  startDock(target) {
    this.state = 'docking'; this.dockT = 0;
    this.x0 = this.x; this.y0 = this.y;
    this.dockTarget = target;
  }
  draw(ctx) {
    if (this.state === 'fused' && this.fuseT >= 1) return;
    const fade = this.state === 'fused' ? this.fuseT : 0;
    drawVesicle(ctx, this.x, this.y, this.r, fade);
  }
}

// SSRI molecule (drug)
class SSRI {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 10;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.state = 'free'; // free, transitTo, locked
    this.pathT = 0; this.pathSpeed = 0;
    this.pathStart = null; this.pathEnd = null;
    this.targetTr = null;
  }
  update(dt) {
    if (this.state === 'transitTo') {
      this.pathT += this.pathSpeed * dt;
      if (this.pathT >= 1) {
        this.pathT = 1;
        this.x = this.pathEnd.x; this.y = this.pathEnd.y;
        this.state = 'locked';
        if (this.targetTr) this.targetTr.blocked = true;
        return;
      }
      const tt = this.pathT;
      const ease = tt * tt * (3 - 2 * tt);
      this.x = lerp(this.pathStart.x, this.pathEnd.x, ease);
      this.y = lerp(this.pathStart.y, this.pathEnd.y, ease);
      return;
    }
    if (this.state === 'locked') return;
    this.vx += (Math.random() - 0.5) * 0.1;
    this.vy += (Math.random() - 0.5) * 0.1;
    this.vx *= 0.96; this.vy *= 0.96;
    this.x += this.vx; this.y += this.vy;
    if (this.y < 50) { this.y = 50; this.vy = Math.abs(this.vy); }
    if (this.y > H - 50) { this.y = H - 50; this.vy = -Math.abs(this.vy); }
  }
  setTransit(end, speed, tr) {
    this.state = 'transitTo';
    this.pathStart = { x: this.x, y: this.y };
    this.pathEnd = end;
    this.pathT = 0; this.pathSpeed = speed;
    this.targetTr = tr;
  }
  draw(ctx) {
    ctx.save();
    // capsule shape
    const x = this.x, y = this.y, r = this.r;
    const g = ctx.createLinearGradient(x - r, y, x + r, y);
    g.addColorStop(0, '#bae6fd');
    g.addColorStop(0.5, C_SSRI);
    g.addColorStop(1, '#0284c7');
    ctx.fillStyle = g;
    roundRect(ctx, x - r * 1.6, y - r * 0.7, r * 3.2, r * 1.4, r * 0.7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1; ctx.stroke();
    // glow
    const gg = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
    gg.addColorStop(0, 'rgba(125, 211, 252, 0.5)');
    gg.addColorStop(1, 'rgba(125, 211, 252, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, r * 2.5, 0, Math.PI * 2); ctx.fill();
    // label
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '700 8px -apple-system, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('SSRI', x, y + 0.5);
    ctx.restore();
  }
}

// =====================================================
//  Label helper
// =====================================================
function drawLabel(ctx, text, lx, ly, tx, ty, color = '#ffd166', fontSize = 14) {
  // Convert hex color to rgb for gradient stops
  function hexToRgb(h) {
    const c = h.replace('#', '');
    return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)];
  }
  const [r, g, b] = hexToRgb(color);
  ctx.save();

  // Tapered fading leader: gradient from label color → transparent at the dot
  const leaderGrad = ctx.createLinearGradient(lx, ly, tx, ty);
  leaderGrad.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
  leaderGrad.addColorStop(1, `rgba(${r},${g},${b},0.25)`);
  ctx.strokeStyle = leaderGrad;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(tx, ty);
  ctx.stroke();

  // Pulsing target ring at the anchor point
  const pulse = (Math.sin((animT || 0) / 400) + 1) * 0.5;
  // outer pulsing ring
  ctx.strokeStyle = `rgba(${r},${g},${b},${0.3 + pulse * 0.3})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(tx, ty, 8 + pulse * 3, 0, Math.PI * 2);
  ctx.stroke();
  // soft glow
  const dotGlow = ctx.createRadialGradient(tx, ty, 0, tx, ty, 14);
  dotGlow.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
  dotGlow.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = dotGlow;
  ctx.beginPath(); ctx.arc(tx, ty, 14, 0, Math.PI * 2); ctx.fill();
  // solid core dot
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(tx, ty, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(tx - 0.8, ty - 0.8, 1.4, 0, Math.PI * 2); ctx.fill();

  // Glassmorphic label pill
  ctx.font = `600 ${fontSize}px -apple-system, system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const m = ctx.measureText(text);
  const padX = 14, padY = 8;
  const bw = m.width + padX * 2;
  const bh = fontSize + padY * 2;
  const bx = lx - bw / 2, by = ly - bh / 2;

  // Drop shadow
  ctx.shadowBlur = 18;
  ctx.shadowColor = `rgba(${r},${g},${b},0.35)`;
  ctx.shadowOffsetY = 3;

  // Frosted glass body — vertical gradient
  const bgGrad = ctx.createLinearGradient(0, by, 0, by + bh);
  bgGrad.addColorStop(0, 'rgba(28, 32, 48, 0.92)');
  bgGrad.addColorStop(1, 'rgba(14, 18, 30, 0.92)');
  ctx.fillStyle = bgGrad;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill(); }
  else { ctx.fillRect(bx, by, bw, bh); }

  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  // Subtle accent border + top highlight
  ctx.strokeStyle = `rgba(${r},${g},${b},0.55)`;
  ctx.lineWidth = 1;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.stroke(); }
  // glossy top highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx + 1, by + 1, bw - 2, bh / 2, bh / 2 - 1);
  ctx.stroke();

  // Text — with subtle letter spacing via spaces in font features (just clean text)
  ctx.fillStyle = color;
  ctx.fillText(text, lx, ly + 0.5);

  ctx.restore();
}

// =====================================================
//  SCENE 3: Calcium — The Trigger
// =====================================================
const sceneCalcium = {
  phase: 'Step 3: Calcium · The Trigger',
  phaseColor: '#4ade80',
  notes: "<strong>Calcium plays a key role in helping one neuron pass a signal to the next.</strong> When the action potential reaches the end of the neuron, it opens <strong>voltage-gated Ca²⁺ channels</strong>. <strong>Calcium ions (Ca²⁺) rush IN</strong> to the axon terminal. This calcium signal is what tells the vesicles to release their neurotransmitters. <strong>Without calcium, the message stops here.</strong>",
  notebook: "Draw Ca²⁺ channels opening as the action potential arrives. Show Ca²⁺ rushing IN. <strong>Calcium = the trigger. No calcium → no neurotransmitters released.</strong>",
  setup() {
    clearField();
    const ves = [];
    const positions = [
      { x: 380, y: 250 }, { x: 460, y: 220 }, { x: 540, y: 270 },
      { x: 410, y: 320 }, { x: 500, y: 350 }, { x: 600, y: 310 },
      { x: 380, y: 400 }, { x: 470, y: 420 }, { x: 560, y: 390 },
      { x: 640, y: 270 }, { x: 640, y: 380 }
    ];
    positions.forEach(p => ves.push(new Vesicle(p.x, p.y)));
    const ca = [];
    for (let i = 0; i < 12; i++) {
      const cy = ACT_TOP + 20 + Math.random() * (ACT_BOT - ACT_TOP - 40);
      const cx = PRE_MEM_X + 20 + Math.random() * (POST_MEM_X - PRE_MEM_X - 40);
      ca.push(new Calcium(cx, cy, 'outside'));
    }
    sceneLocal = {
      vesicles: ves, calciums: ca,
      channels: CA_CHANNEL_YS.map(y => ({ y, openness: 0, target: 0 })),
      cycleT: 0,
      boltProgress: 0,
      naSputters: [],
      sputterEmitted: false,
      apArrived: 0
    };
  },
  update(dt) {
    // 4-second loop: bolt arrives → Na⁺ sputters → Ca²⁺ pours in → reset
    sceneLocal.cycleT += dt;
    const cycle = 4000;
    const phase = (sceneLocal.cycleT % cycle) / cycle;
    const justWrapped = phase < 0.05 && (sceneLocal.lastPhase || 0) > 0.7;
    sceneLocal.lastPhase = phase;
    if (justWrapped) {
      sceneLocal.boltProgress = 0;
      sceneLocal.naSputters = [];
      sceneLocal.sputterEmitted = false;
      sceneLocal.channels.forEach(c => { c.openness = 0; c.target = 0; });
      // re-create calciums in cleft
      sceneLocal.calciums = [];
      for (let i = 0; i < 12; i++) {
        const cy = ACT_TOP + 20 + Math.random() * (ACT_BOT - ACT_TOP - 40);
        const cx = PRE_MEM_X + 20 + Math.random() * (POST_MEM_X - PRE_MEM_X - 40);
        sceneLocal.calciums.push(new Calcium(cx, cy, 'outside'));
      }
    }

    // bolt travels in during phase 0.0 → 0.35
    sceneLocal.boltProgress = clamp(phase / 0.35, 0, 1);

    // Na⁺ sputter inside the bouton at the moment the bolt arrives (phase ~0.32)
    if (phase > 0.32 && !sceneLocal.sputterEmitted) {
      sceneLocal.sputterEmitted = true;
      for (let i = 0; i < 8; i++) {
        sceneLocal.naSputters.push({
          x: 230 + Math.random() * 110,
          y: MID + (Math.random() - 0.5) * 90,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          life: 1
        });
      }
    }
    sceneLocal.naSputters.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      n.vx *= 0.96; n.vy *= 0.96;
      n.life -= 0.014;
    });
    sceneLocal.naSputters = sceneLocal.naSputters.filter(n => n.life > 0);

    // Ca²⁺ channels open just AFTER the sputter (phase 0.45+)
    sceneLocal.channels.forEach((c, i) => {
      if (phase > 0.45 + i * 0.03) c.target = 1;
      c.openness = lerp(c.openness, c.target, 0.08);
    });
    sceneLocal.apArrived = clamp((phase - 0.32) / 0.2, 0, 1);

    sceneLocal.calciums.forEach(c => {
      if (c.state === 'free' && c.region === 'outside') {
        for (const ch of sceneLocal.channels) {
          if (ch.openness > 0.6 && Math.abs(c.y - ch.y) < 50 && Math.abs(c.x - PRE_MEM_X) < 80) {
            c.setTransit({ x: PRE_MEM_X - 60, y: ch.y + (Math.random() - 0.5) * 20 }, 1.6 / 1000);
            break;
          }
        }
      }
      c.update(dt);
    });
    sceneLocal.vesicles.forEach(v => v.update(dt));
  },
  draw(ctx, t) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    drawPresynapticTerminal(ctx);
    drawPostsynapticDendrite(ctx);

    // INCOMING BOLT from the left, ripping down the axon stem into the bouton
    if (sceneLocal.boltProgress > 0) {
      drawLightningBolt(ctx, 0, 320, MID, sceneLocal.boltProgress, []);
    }

    // bouton interior flash when AP just arrived
    if (sceneLocal.apArrived > 0) {
      ctx.save();
      const fade = Math.max(0, 1 - sceneLocal.apArrived * 1.4);
      ctx.fillStyle = `rgba(255, 209, 102, ${0.10 * fade + 0.04})`;
      ctx.fillRect(220, ACT_TOP - 30, PRE_MEM_X - 220, ACT_BOT - ACT_TOP + 60);
      ctx.restore();
    }

    sceneLocal.vesicles.forEach(v => v.draw(ctx));

    // Na⁺ SPUTTER — the reminder that sodium is what drove the AP
    sceneLocal.naSputters.forEach(n => {
      ctx.save();
      ctx.globalAlpha = n.life;
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 20);
      g.addColorStop(0, 'rgba(255, 122, 107, 0.6)');
      g.addColorStop(1, 'rgba(255, 122, 107, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, 20, 0, Math.PI * 2); ctx.fill();
      const cg = ctx.createRadialGradient(n.x - 2, n.y - 2, 0, n.x, n.y, 7);
      cg.addColorStop(0, 'rgba(255,255,255,0.95)');
      cg.addColorStop(0.4, C_NA);
      cg.addColorStop(1, '#c43c30');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '700 9px -apple-system, system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Na⁺', n.x, n.y + 0.5);
      ctx.restore();
    });

    sceneLocal.channels.forEach(c => drawCalciumChannel(ctx, c.y, c.openness));
    TRANS_YS.forEach(y => drawTransporter(ctx, y, 0, t));
    RECEPTOR_YS.forEach(y => drawReceptor(ctx, y, 0));
    sceneLocal.calciums.forEach(c => c.draw(ctx));

    // header — staged messaging based on cycle phase
    ctx.save();
    ctx.font = '700 16px -apple-system, system-ui';
    ctx.textAlign = 'center';
    const phase = (sceneLocal.cycleT % 4000) / 4000;
    if (phase < 0.32) {
      ctx.fillStyle = '#ffd166';
      ctx.fillText('action potential travels in →', 220, 50);
    } else if (phase < 0.5) {
      ctx.fillStyle = C_NA;
      ctx.fillText('Na⁺ pulse — the AP is sodium', 280, 50);
    } else {
      ctx.fillStyle = C_NA;
      ctx.fillText('Na⁺ →', 230, 50);
      ctx.fillStyle = C_CA;
      ctx.fillText('opens Ca²⁺ channels → Ca²⁺ floods IN', 540, 50);
    }
    ctx.restore();
  }
};

    { x: 410, y: 320, dockY: 325, willDock: true, delay: 360 },
    { x: 500, y: 350, dockY: 365, willDock: true, delay: 540 },
    { x: 600, y: 310, dockY: 285, willDock: false },
    { x: 380, y: 400, dockY: 410, willDock: true, delay: 720 },
    { x: 470, y: 420, dockY: 410, willDock: false },
    { x: 560, y: 390, dockY: 365, willDock: false },
    { x: 640, y: 270, dockY: 240, willDock: false },
    { x: 640, y: 380, dockY: 410, willDock: false }
  ];
  positions.forEach(p => {
    const v = new Vesicle(p.x, p.y);
    v.willDock = p.willDock;
    v.dockY = p.dockY;
    v.delay = p.delay || 0;
    state.vesicles.push(v);
  });
  state.calciums = [];
  for (let i = 0; i < 10; i++) {
    const cy = ACT_TOP + 20 + Math.random() * (ACT_BOT - ACT_TOP - 40);
    const cx = 340 + Math.random() * (PRE_MEM_X - 340 - 30);
    state.calciums.push(new Calcium(cx, cy, 'inside'));
  }
  state.released = new Set();
  state.nts = [];
  state.naIons = [];
  state.sparkles = [];
  state.boltT = 0;
  state.ignition = 0;
  state.receptors.forEach(r => { r.bound = 0; r.target = 0; r.slot = null; });
}

const sceneReleaseBindFire = {
  phase: 'Step 4: Release · Bind · Fire',
  phaseColor: '#f472b6',
  notes: "Calcium tells the vesicles to <strong>fuse with the membrane</strong> and dump their <strong>neurotransmitters</strong> into the synapse. The NTs drift across and click into <strong>receptors</strong> on the next neuron, like a ball into a socket. Each binding opens an ion channel and <strong>Na⁺ floods IN</strong>. The next neuron depolarizes and a brand new <strong>action potential</strong> takes off down its axon. <strong>The signal has been passed.</strong>",
  notebook: "Sketch the whole chain: vesicles fusing → NTs released → NTs binding receptors (ball into socket) → Na⁺ flooding IN → new action potential firing down the next neuron. Label every part.",
  setup() {
    clearField();
    sceneLocal = {
      receptors: RECEPTOR_YS.map(y => ({ y, bound: 0, target: 0, slot: null })),
      cycleT: 0,
      lastPhase: 0
    };
    initReleaseBindFireCycle(sceneLocal);
  },
  update(dt) {
    sceneLocal.cycleT += dt;
    const cycle = 7000;
    const phase = (sceneLocal.cycleT % cycle) / cycle;

    // cycle reset
    if (phase < 0.05 && sceneLocal.lastPhase > 0.7) {
      initReleaseBindFireCycle(sceneLocal);
    }

    // RELEASE PHASE — vesicles dock and dump NTs (phase 0 → ~0.18)
    sceneLocal.calciums.forEach(c => c.update(dt));
    sceneLocal.vesicles.forEach((v, i) => {
      const elapsed = phase * cycle;
      if (v.willDock && v.state === 'rest' && elapsed > v.delay + 100) {
        v.startDock({ x: PRE_MEM_X - 12, y: v.dockY });
      }
      v.update(dt);
      if (v.state === 'fused' && !sceneLocal.released.has(i)) {
        sceneLocal.released.add(i);
        for (let k = 0; k < 5; k++) {
          const nt = new NT(v.x + 14, v.y + (Math.random() - 0.5) * 16);
          nt.vx = 0.6 + Math.random() * 0.6;
          nt.vy = (Math.random() - 0.5) * 0.8;
          sceneLocal.nts.push(nt);
        }
      }
    });

    // BIND PHASE — receptors lock NTs as they arrive (continuous after release starts)
    sceneLocal.receptors.forEach(r => {
      if (r.slot == null && r.target < 0.5) {
        const candidate = sceneLocal.nts.find(n => n.state === 'free');
        if (candidate && Math.random() < 0.18) {
          const dest = { x: POST_MEM_X - 10, y: r.y };
          candidate.setTransit(dest, 1.5 / 1000, 'receptor', r);
          r.slot = candidate;
          r.target = 1;
        }
      }
      r.bound = lerp(r.bound, r.target, 0.06);
      if (r.bound > 0.6 && Math.random() < 0.08 * r.bound) {
        sceneLocal.naIons.push({
          x: POST_MEM_X + 22,
          y: r.y + (Math.random() - 0.5) * 26,
          vx: 0.6 + Math.random() * 0.7,
          vy: (Math.random() - 0.5) * 0.4,
          life: 1
        });
      }
    });
    sceneLocal.nts.forEach(n => n.update(dt));
    sceneLocal.naIons.forEach(n => { n.x += n.vx; n.y += n.vy; n.life -= 0.005; });
    sceneLocal.naIons = sceneLocal.naIons.filter(n => n.life > 0 && n.x < W);

    // FIRE PHASE — ignition flash + bolt travels (phase 0.55 → 1.0)
    if (phase < 0.55) {
      sceneLocal.boltT = 0;
      sceneLocal.ignition = 0;
    } else if (phase < 0.62) {
      const f = (phase - 0.55) / 0.07;
      sceneLocal.boltT = 0;
      sceneLocal.ignition = 1 - f;
    } else {
      sceneLocal.boltT = clamp((phase - 0.62) / 0.32, 0, 1);
      sceneLocal.ignition = Math.max(0, sceneLocal.ignition - dt / 250);
    }
    if (phase >= 0.55 && sceneLocal.lastPhase < 0.55) {
      sceneLocal.ignition = 1;
    }
    sceneLocal.lastPhase = phase;

    // bolt sparkles
    if (sceneLocal.boltT > 0 && sceneLocal.boltT < 1 && Math.random() < 0.4) {
      const x = lerp(POST_MEM_X + 60, W - 30, sceneLocal.boltT);
      sceneLocal.sparkles.push({
        x, y: MID + (Math.random() - 0.5) * 12,
        vx: (Math.random() - 0.5), vy: (Math.random() - 0.5),
        life: 1
      });
    }
    sceneLocal.sparkles.forEach(s => { s.x += s.vx; s.y += s.vy; s.life -= 0.04; });
    sceneLocal.sparkles = sceneLocal.sparkles.filter(s => s.life > 0);
  },
  draw(ctx, t) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    drawPresynapticTerminal(ctx);
    drawPostsynapticDendrite(ctx);
    sceneLocal.vesicles.forEach(v => v.draw(ctx));
    sceneLocal.calciums.forEach(c => c.draw(ctx));
    sceneLocal.nts.forEach(n => n.draw(ctx));
    sceneLocal.receptors.forEach(r => drawReceptor(ctx, r.y, r.bound));
    CA_CHANNEL_YS.forEach(y => drawCalciumChannel(ctx, y, 1));
    TRANS_YS.forEach(y => drawTransporter(ctx, y, 0, t));

    sceneLocal.naIons.forEach(n => {
      ctx.save();
      ctx.globalAlpha = n.life;
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 18);
      g.addColorStop(0, 'rgba(255, 122, 107, 0.55)');
      g.addColorStop(1, 'rgba(255, 122, 107, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C_NA;
      ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '700 9px -apple-system, system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Na⁺', n.x, n.y);
      ctx.restore();
    });

    // ignition flash at active zone — Na⁺ becomes the new electrical signal
    if (sceneLocal.ignition > 0) {
      ctx.save();
      const f = sceneLocal.ignition;
      const fx = POST_MEM_X + 50;
      const fy = MID;
      const r = 30 + (1 - f) * 90;
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, r);
      g.addColorStop(0, `rgba(255, 240, 180, ${0.85 * f})`);
      g.addColorStop(0.4, `rgba(255, 209, 102, ${0.55 * f})`);
      g.addColorStop(1, 'rgba(255, 209, 102, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255, 255, 240, ${f * 0.9})`;
      ctx.beginPath(); ctx.arc(fx, fy, 12 * f, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // new action potential bolt traveling on postsynaptic side
    drawLightningBolt(ctx, POST_MEM_X + 60, W - 30, MID, sceneLocal.boltT, sceneLocal.sparkles);

    // staged header text — narrates the chain in three beats
    ctx.save();
    ctx.font = '700 16px -apple-system, system-ui';
    ctx.textAlign = 'center';
    const phase = (sceneLocal.cycleT % 7000) / 7000;
    if (phase < 0.20) {
      ctx.fillStyle = C_NT;
      ctx.fillText('vesicles fuse → neurotransmitters released into the synapse', 480, 60);
    } else if (phase < 0.55) {
      ctx.fillStyle = C_PROT;
      ctx.fillText('NTs bind receptors (ball-in-socket) → Na⁺ floods IN', 600, 60);
    } else if (phase < 0.65) {
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Na⁺ becomes the new electrical signal →', POST_MEM_X + 220, 60);
    } else {
      ctx.fillStyle = '#ffd166';
      ctx.fillText('signal continues down the next neuron →', POST_MEM_X + 220, 60);
    }
    ctx.restore();
  }
};

const sceneReuptake = {
  phase: 'Step 5: Reuptake',
  phaseColor: '#5eead4',
  notes: "Once the message is passed, the synapse needs to <strong>reset</strong>. <strong>Reuptake transporters</strong> on the presynaptic membrane <strong>vacuum the leftover neurotransmitters back into the terminal</strong>. The NTs are then <strong>repackaged into vesicles</strong> so they can be used again. Without reuptake, NTs would build up forever and never stop signaling.",
  notebook: "Draw transporters <strong>vacuuming NTs back IN</strong> to the terminal, then watch each NT load INTO an empty vesicle. Label: <strong>REUPTAKE → REPACKAGED</strong>. The same NTs get used over and over.",
  setup() {
    clearField();
    const nts = [];
    for (let i = 0; i < 18; i++) {
      const y = ACT_TOP + 14 + Math.random() * (ACT_BOT - ACT_TOP - 28);
      const x = PRE_MEM_X + 20 + Math.random() * (POST_MEM_X - PRE_MEM_X - 40);
      nts.push(new NT(x, y));
    }
    // empty vesicles waiting to be refilled
    const vesPositions = [
      { x: 380, y: 250 }, { x: 460, y: 220 }, { x: 540, y: 270 },
      { x: 410, y: 320 }, { x: 500, y: 350 }, { x: 600, y: 310 },
      { x: 380, y: 400 }, { x: 470, y: 420 }, { x: 560, y: 390 },
      { x: 640, y: 270 }, { x: 640, y: 380 }
    ];
    const vesicles = vesPositions.map(p => ({
      x: p.x, y: p.y, r: 18,
      fillness: 0.2,  // start mostly empty so refill is visible
      pulseT: 0,
      assigned: 0    // count of NTs heading to this vesicle
    }));
    const transporters = TRANS_YS.map(y => ({ y, busy: false, busyT: 0 }));
    sceneLocal = { nts, vesicles, transporters, time: 0 };
  },
  update(dt) {
    sceneLocal.time += dt;

    // keep the cleft populated so demo loops continuously
    const cleftCount = sceneLocal.nts.filter(n => n.state === 'free').length;
    if (cleftCount < 6 && Math.random() < 0.04) {
      for (let i = 0; i < 2; i++) {
        const y = ACT_TOP + 14 + Math.random() * (ACT_BOT - ACT_TOP - 28);
        const x = PRE_MEM_X + 20 + Math.random() * 30;
        sceneLocal.nts.push(new NT(x, y));
      }
    }

    sceneLocal.transporters.forEach(tr => {
      if (!tr.busy) {
        // grab nearest free NT
        let nearest = null, ndist = 9999;
        sceneLocal.nts.forEach(n => {
          if (n.state === 'free' && Math.abs(n.y - tr.y) < 90) {
            const d = Math.abs(n.x - PRE_MEM_X) + Math.abs(n.y - tr.y) * 0.5;
            if (d < ndist) { ndist = d; nearest = n; }
          }
        });
        if (nearest) {
          // pick the most empty vesicle near this transporter as the destination
          const target = sceneLocal.vesicles
            .filter(v => v.fillness + v.assigned * 0.16 < 1)
            .sort((a, b) =>
              ((a.fillness + a.assigned * 0.16) + Math.abs(a.y - tr.y) * 0.0015) -
              ((b.fillness + b.assigned * 0.16) + Math.abs(b.y - tr.y) * 0.0015))[0];
          if (target) {
            target.assigned += 1;
            nearest.targetVesicle = target;
            nearest.setTransit({ x: target.x, y: target.y }, 1.6 / 1000, 'reuptake');
            tr.busy = true; tr.busyT = 0;
          }
        }
      } else {
        tr.busyT += dt;
        if (tr.busyT > 500) tr.busy = false;
      }
    });

    // update NTs; when a reuptake-bound NT arrives at its vesicle, fill it
    sceneLocal.nts.forEach(n => {
      const wasTransit = n.state === 'transitTo';
      n.update(dt);
      if (wasTransit && n.state === 'recycled' && n.targetVesicle) {
        n.targetVesicle.fillness = Math.min(1, n.targetVesicle.fillness + 0.16);
        n.targetVesicle.pulseT = 1;
        n.targetVesicle.assigned = Math.max(0, n.targetVesicle.assigned - 1);
        n.targetVesicle = null;
      }
    });

    // drain pulses; full vesicles slowly release one NT back to the cleft (continuous cycle)
    sceneLocal.vesicles.forEach(v => {
      if (v.pulseT > 0) v.pulseT = Math.max(0, v.pulseT - dt / 600);
      if (v.fillness >= 0.95 && Math.random() < 0.0025) {
        v.fillness -= 0.18;
        const nt = new NT(v.x + 12, v.y);
        nt.vx = 0.8 + Math.random() * 0.6;
        nt.vy = (Math.random() - 0.5) * 0.5;
        sceneLocal.nts.push(nt);
      }
    });

    // garbage-collect 'recycled' NTs to keep the array small
    sceneLocal.nts = sceneLocal.nts.filter(n => n.state !== 'recycled');
  },
  draw(ctx, t) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    drawPresynapticTerminal(ctx);
    drawPostsynapticDendrite(ctx);

    // RECYCLING vesicles: variable fillness + pulse when refilled
    sceneLocal.vesicles.forEach(v => {
      ctx.save();
      const scale = 1 + v.pulseT * 0.18;
      const r = v.r * scale;
      // membrane
      const g = ctx.createRadialGradient(v.x - r * 0.3, v.y - r * 0.3, 0, v.x, v.y, r);
      g.addColorStop(0, 'rgba(255, 245, 220, 0.85)');
      g.addColorStop(0.7, 'rgba(255, 220, 170, 0.65)');
      g.addColorStop(1, 'rgba(212, 165, 84, 0.45)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(v.x, v.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 209, 102, 0.85)';
      ctx.lineWidth = 1.5; ctx.stroke();
      // pink pulse halo when just refilled
      if (v.pulseT > 0) {
        const ph = ctx.createRadialGradient(v.x, v.y, 0, v.x, v.y, r * 2.4);
        ph.addColorStop(0, `rgba(244, 114, 182, ${v.pulseT * 0.55})`);
        ph.addColorStop(1, 'rgba(244, 114, 182, 0)');
        ctx.fillStyle = ph;
        ctx.beginPath(); ctx.arc(v.x, v.y, r * 2.4, 0, Math.PI * 2); ctx.fill();
      }
      // NT cargo dots based on fillness (0..6 dots)
      const dotCount = Math.round(v.fillness * 6);
      ctx.fillStyle = C_NT;
      for (let i = 0; i < dotCount; i++) {
        const a = i * 1.04;
        const rr = v.r * 0.5;
        ctx.beginPath();
        ctx.arc(v.x + Math.cos(a) * rr, v.y + Math.sin(a) * rr, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });

    sceneLocal.nts.forEach(n => n.draw(ctx));
    RECEPTOR_YS.forEach(y => drawReceptor(ctx, y, 0));
    CA_CHANNEL_YS.forEach(y => drawCalciumChannel(ctx, y, 0));
    sceneLocal.transporters.forEach(tr => drawTransporter(ctx, tr.y, 1, t));

    // big inward arrows next to each transporter for clarity
    ctx.save();
    sceneLocal.transporters.forEach(tr => {
      const pulse = (Math.sin(sceneLocal.time / 220 + tr.y * 0.05) + 1) * 0.5;
      ctx.strokeStyle = `rgba(94, 234, 212, ${0.55 + pulse * 0.35})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 5]);
      ctx.beginPath();
      ctx.moveTo(PRE_MEM_X + 100, tr.y);
      ctx.lineTo(PRE_MEM_X - 60, tr.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = `rgba(94, 234, 212, ${0.7 + pulse * 0.3})`;
      ctx.beginPath();
      ctx.moveTo(PRE_MEM_X - 50, tr.y);
      ctx.lineTo(PRE_MEM_X - 32, tr.y - 9);
      ctx.lineTo(PRE_MEM_X - 32, tr.y + 9);
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();

    ctx.save();
    ctx.fillStyle = C_TRANS;
    ctx.font = '900 22px -apple-system, system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('REUPTAKE → REPACKAGED', PRE_MEM_X + 5, 60);
    ctx.font = '500 13px -apple-system, system-ui';
    ctx.fillStyle = 'rgba(94, 234, 212, 0.85)';
    ctx.fillText('transporters vacuum NTs back IN, then load them into vesicles to use again', PRE_MEM_X + 5, 82);
    ctx.restore();
  }
};

      if (ap.progress < 1 && Math.random() < 0.4) {
        const x = lerp(POST_MEM_X + 60, W - 30, ap.progress);
        sceneLocal.sparkles.push({ x, y: MID + (Math.random() - 0.5) * 12, vx: (Math.random() - 0.5), vy: (Math.random() - 0.5), life: 1 });
      }
    });
    sceneLocal.sparkles.forEach(s => { s.x += s.vx; s.y += s.vy; s.life -= 0.04; });
    sceneLocal.sparkles = sceneLocal.sparkles.filter(s => s.life > 0);
  },
  draw(ctx, t) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    drawPresynapticTerminal(ctx);
    drawPostsynapticDendrite(ctx);
    sceneLocal.nts.forEach(n => n.draw(ctx));
    sceneLocal.receptors.forEach(r => drawReceptor(ctx, r.y, r.bound));
    CA_CHANNEL_YS.forEach(y => drawCalciumChannel(ctx, y, 0.4));
    TRANS_YS.forEach(y => drawTransporter(ctx, y, 0.6, t));

    sceneLocal.naIons.forEach(n => {
      ctx.save();
      ctx.globalAlpha = n.life;
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 16);
      g.addColorStop(0, 'rgba(255, 122, 107, 0.5)');
      g.addColorStop(1, 'rgba(255, 122, 107, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C_NA;
      ctx.beginPath(); ctx.arc(n.x, n.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '700 9px -apple-system, system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Na⁺', n.x, n.y);
      ctx.restore();
    });

    sceneLocal.apTrains.forEach(ap => {
      drawLightningBolt(ctx, POST_MEM_X + 60, W - 30, MID, ap.progress, []);
    });
    sceneLocal.sparkles.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.life * 0.7;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 16);
      g.addColorStop(0, 'rgba(255,255,220,0.9)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    const ntCount = sceneLocal.nts.length;
    let label = 'normal range', color = '#f472b6';
    if (ntCount > 35) { label = 'flooded · fast firing'; color = '#ff7a6b'; }
    else if (ntCount < 8) { label = 'depleted · slow firing'; color = '#5eead4'; }
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = '700 18px -apple-system, system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(label.toUpperCase(), CLEFT_MID, 60);
    ctx.restore();
  },
  addNTs(count = 8) {
    for (let i = 0; i < count; i++) {
      const y = ACT_TOP + 14 + Math.random() * (ACT_BOT - ACT_TOP - 28);
      const x = PRE_MEM_X + 20 + Math.random() * (POST_MEM_X - PRE_MEM_X - 40);
      const n = new NT(x, y);
      n.vx = (Math.random() - 0.5) * 0.8;
      n.vy = (Math.random() - 0.5) * 0.8;
      sceneLocal.nts.push(n);
    }
  },
  removeNTs(count = 8) {
    let removed = 0;
    for (let i = sceneLocal.nts.length - 1; i >= 0 && removed < count; i--) {
      if (sceneLocal.nts[i].state === 'free') {
        sceneLocal.nts.splice(i, 1);
        removed++;
      }
    }
  }
};

function drawMiniSynapse(ctx, ox, oy, scale, opts) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.translate(-W / 2, -H / 2);

  // axon stem feeding the bouton
  ctx.strokeStyle = '#c78373';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, MID); ctx.lineTo(220, MID);
  ctx.stroke();

  // bouton — bulb on neck
  const cx1 = 470, cy = MID;
  const fill1 = ctx.createRadialGradient(cx1 - 50, cy - 60, 20, cx1, cy, 300);
  fill1.addColorStop(0, '#f8d9ce');
  fill1.addColorStop(0.5, '#d49a8d');
  fill1.addColorStop(1, '#a86456');
  ctx.fillStyle = fill1;
  ctx.beginPath();
  ctx.moveTo(200, MID - 20);
  ctx.bezierCurveTo(260, MID - 32, 290, MID - 70, 320, MID - 130);
  ctx.bezierCurveTo(360, MID - 200, 510, MID - 230, 620, MID - 200);
  ctx.bezierCurveTo(690, MID - 175, 720, MID - 145, 720, MID - 110);
  ctx.lineTo(720, MID + 110);
  ctx.bezierCurveTo(720, MID + 145, 690, MID + 175, 620, MID + 200);
  ctx.bezierCurveTo(510, MID + 230, 360, MID + 200, 320, MID + 130);
  ctx.bezierCurveTo(290, MID + 70, 260, MID + 32, 200, MID + 20);
  ctx.closePath(); ctx.fill();

  // dendrite stem
  ctx.strokeStyle = '#9a7fc0';
  ctx.lineWidth = 36;
  ctx.beginPath();
  ctx.moveTo(W - 220, MID); ctx.lineTo(W, MID);
  ctx.stroke();

  // dendrite spine — mirrored bulb on neck
  const fill2 = ctx.createRadialGradient(1130 + 50, MID - 60, 20, 1130, MID, 300);
  fill2.addColorStop(0, '#d4c0ee');
  fill2.addColorStop(0.5, '#9a7fc0');
  fill2.addColorStop(1, '#705396');
  ctx.fillStyle = fill2;
  ctx.beginPath();
  ctx.moveTo(W - 200, MID - 20);
  ctx.bezierCurveTo(W - 260, MID - 32, W - 290, MID - 70, W - 320, MID - 130);
  ctx.bezierCurveTo(W - 360, MID - 200, W - 510, MID - 230, W - 620, MID - 200);
  ctx.bezierCurveTo(W - 690, MID - 175, W - 720, MID - 145, W - 720, MID - 110);
  ctx.lineTo(880, MID + 110);
  ctx.bezierCurveTo(W - 720, MID + 145, W - 690, MID + 175, W - 620, MID + 200);
  ctx.bezierCurveTo(W - 510, MID + 230, W - 360, MID + 200, W - 320, MID + 130);
  ctx.bezierCurveTo(W - 290, MID + 70, W - 260, MID + 32, W - 200, MID + 20);
  ctx.closePath(); ctx.fill();

  // active zone membranes
  ctx.strokeStyle = 'rgba(212, 165, 84, 0.85)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(720, MID - 110); ctx.lineTo(720, MID + 110);
  ctx.moveTo(880, MID - 110); ctx.lineTo(880, MID + 110);
  ctx.stroke();

  // vesicles + receptors based on strength
  const ves = opts.vesicles || 4;
  const recs = opts.receptors || 2;
  for (let i = 0; i < ves; i++) {
    const a = i * 1.7;
    const r = 60 + (i % 3) * 30;
    const vx = 380 + Math.cos(a) * r;
    const vy = MID + Math.sin(a) * r * 0.6;
    drawVesicle(ctx, vx, vy, 22, 0);
  }
  // receptors evenly spaced
  for (let i = 0; i < recs; i++) {
    const ry = ACT_TOP + 30 + (i + 0.5) * (ACT_BOT - ACT_TOP - 60) / recs;
    drawReceptor(ctx, ry, opts.fired ? 1 : 0);
  }

  ctx.restore();
}

// Helper: tiny stylized neuron icon (cell body + dendrites + axon stub)
function drawTinyNeuron(ctx, cx, cy, color, axonDir = 1) {
  ctx.save();
  // dendrites (3 short branches on the side opposite axon)
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  const dDir = -axonDir;
  for (const [a, len] of [[-0.6, 26], [0, 30], [0.6, 26]]) {
    ctx.beginPath();
    ctx.moveTo(cx + 12 * dDir, cy + Math.sin(a) * 6);
    ctx.lineTo(cx + (12 + len) * dDir, cy + Math.sin(a) * 24);
    ctx.stroke();
  }
  // cell body
  const sg = ctx.createRadialGradient(cx - 4, cy - 4, 0, cx, cy, 14);
  sg.addColorStop(0, '#ffffff44');
  sg.addColorStop(0.4, color);
  sg.addColorStop(1, color);
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // small specular
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Helper: panel frame with title + description
function drawPlasticityPanel(ctx, x, y, w, h, accent, num, title, desc, drawAnim) {
  ctx.save();
  // card body
  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  bg.addColorStop(0, 'rgba(22, 22, 28, 0.85)');
  bg.addColorStop(1, 'rgba(14, 14, 20, 0.85)');
  ctx.fillStyle = bg;
  ctx.shadowBlur = 14;
  ctx.shadowColor = `${accent}33`;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill(); }
  ctx.shadowBlur = 0;
  // accent border
  ctx.strokeStyle = `${accent}66`;
  ctx.lineWidth = 1.5;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.stroke(); }
  // accent left bar
  ctx.fillStyle = accent;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, 4, h, 2); ctx.fill(); }

  // header row: number + title
  ctx.font = '900 13px -apple-system, system-ui';
  ctx.fillStyle = `${accent}aa`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(num, x + 22, y + 26);

  ctx.fillStyle = 'rgba(220, 220, 230, 0.85)';

  drawAnim();

}
